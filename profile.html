<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nexus Pro - Profile Settings</title>
  <style>
    :root {
      --primary: #0284c7;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #1e293b;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --lock: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
    body { background-color: var(--bg); color: var(--text); display: flex; justify-content: center; padding: 40px 20px; }

    .profile-card {
      background: var(--card-bg);
      width: 100%;
      max-width: 520px;
      padding: 32px;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.05);
      border: 1px solid var(--border);
    }

    h2 { color: var(--primary); font-size: 24px; margin-bottom: 6px; }
    p.subtitle { color: var(--text-muted); font-size: 14px; margin-bottom: 24px; }

    .field-row {
      background: #f8fafc;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px 16px;
      margin-bottom: 14px;
      transition: all 0.2s;
    }

    .field-row.editing {
      border-color: var(--primary);
      background: #ffffff;
    }

    .field-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .field-label {
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-muted);
    }

    .edit-btn {
      background: none;
      border: none;
      cursor: pointer;
      color: var(--primary);
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 13px;
      font-weight: 600;
    }

    .edit-btn:hover { opacity: 0.8; }

    .lock-badge {
      font-size: 12px;
      color: var(--lock);
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .view-value {
      font-size: 15px;
      font-weight: 600;
      color: var(--text);
      margin-top: 6px;
    }

    .edit-control {
      display: none;
      margin-top: 10px;
    }

    input, select {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 14px;
      outline: none;
      background-color: #ffffff;
    }

    input:focus, select:focus { border-color: var(--primary); }

    .password-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .save-section {
      display: none;
      margin-top: 24px;
      padding-top: 20px;
      border-top: 1px dashed var(--border);
    }

    .btn-save {
      width: 100%;
      padding: 14px;
      background-color: var(--primary);
      color: #fff;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 15px;
      margin-top: 10px;
    }

    .btn-save:hover { opacity: 0.95; }

    .alert {
      padding: 12px;
      border-radius: 8px;
      font-size: 14px;
      margin-bottom: 20px;
      display: none;
    }
    .alert-danger { background-color: #fef2f2; color: #dc2626; border: 1px solid #fecaca; }
    .alert-success { background-color: #f0fdf4; color: #16a34a; border: 1px solid #bbf7d0; }
  </style>
</head>
<body>

<div class="profile-card">
  <h2>Account Profile</h2>
  <p class="subtitle">Click the pencil icon to modify your account details.</p>

  <div id="alertBox" class="alert"></div>

  <form id="profileForm">
    <!-- 1. EMAIL ADDRESS (LOCKED) -->
    <div class="field-row">
      <div class="field-header">
        <span class="field-label">Email Address</span>
        <span class="lock-badge">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
          Locked
        </span>
      </div>
      <div class="view-value" id="viewEmail">Loading...</div>
    </div>

    <!-- 2. FIRST NAME -->
    <div class="field-row" id="rowFirstName">
      <div class="field-header">
        <span class="field-label">First Name</span>
        <button type="button" class="edit-btn" onclick="toggleEdit('FirstName')">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>
          Edit
        </button>
      </div>
      <div class="view-value" id="viewFirstName">Loading...</div>
      <div class="edit-control" id="editFirstName">
        <input type="text" id="inputFirstName" />
      </div>
    </div>

    <!-- 3. LAST NAME -->
    <div class="field-row" id="rowLastName">
      <div class="field-header">
        <span class="field-label">Last Name</span>
        <button type="button" class="edit-btn" onclick="toggleEdit('LastName')">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>
          Edit
        </button>
      </div>
      <div class="view-value" id="viewLastName">Loading...</div>
      <div class="edit-control" id="editLastName">
        <input type="text" id="inputLastName" />
      </div>
    </div>

    <!-- 4. EDUCATIONAL LEVEL -->
    <div class="field-row" id="rowEduType">
      <div class="field-header">
        <span class="field-label">Educational Level</span>
        <button type="button" class="edit-btn" onclick="toggleEdit('EduType')">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>
          Edit
        </button>
      </div>
      <div class="view-value" id="viewEduType">Loading...</div>
      <div class="edit-control" id="editEduType">
        <select id="inputEduType" onchange="handleEduTypeChange()">
          <option value="secondary">Secondary School</option>
          <option value="tertiary">Tertiary Institution</option>
        </select>
      </div>
    </div>

    <!-- 5. SECONDARY CLASS -->
    <div class="field-row" id="rowClass">
      <div class="field-header">
        <span class="field-label">Class</span>
        <button type="button" class="edit-btn" onclick="toggleEdit('Class')">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>
          Edit
        </button>
      </div>
      <div class="view-value" id="viewClass">Loading...</div>
      <div class="edit-control" id="editClass">
        <select id="inputClass">
          <option value="SS1">SS1</option>
          <option value="SS2">SS2</option>
          <option value="SS3">SS3</option>
          <option value="JSS3">JSS3</option>
        </select>
      </div>
    </div>

    <!-- 6. TERTIARY COURSE -->
    <div class="field-row" id="rowCourse" style="display: none;">
      <div class="field-header">
        <span class="field-label">Course of Study</span>
        <button type="button" class="edit-btn" onclick="toggleEdit('Course')">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>
          Edit
        </button>
      </div>
      <div class="view-value" id="viewCourse">Loading...</div>
      <div class="edit-control" id="editCourse">
        <input type="text" id="inputCourse" placeholder="e.g. Computer Science" />
      </div>
    </div>

    <!-- 7. TERTIARY LEVEL -->
    <div class="field-row" id="rowLevel" style="display: none;">
      <div class="field-header">
        <span class="field-label">Level</span>
        <button type="button" class="edit-btn" onclick="toggleEdit('Level')">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>
          Edit
        </button>
      </div>
      <div class="view-value" id="viewLevel">Loading...</div>
      <div class="edit-control" id="editLevel">
        <select id="inputLevel">
          <option value="100L">100 Level</option>
          <option value="200L">200 Level</option>
          <option value="300L">300 Level</option>
          <option value="400L">400 Level</option>
          <option value="500L">500 Level</option>
        </select>
      </div>
    </div>

    <!-- 8. PASSWORD UPDATE OPTION -->
    <div class="field-row" id="rowPassword">
      <div class="field-header">
        <span class="field-label">Password</span>
        <button type="button" class="edit-btn" onclick="toggleEdit('Password')">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>
          Change Password
        </button>
      </div>
      <div class="view-value" id="viewPassword">••••••••••••</div>
      <div class="edit-control" id="editPassword">
        <div class="password-group">
          <input type="password" id="inputNewPassword" placeholder="Enter new password" />
          <input type="password" id="inputConfirmPassword" placeholder="Confirm new password" />
        </div>
      </div>
    </div>

    <!-- SAVE FOOTER -->
    <div class="save-section" id="saveSection">
      <div class="form-group">
        <label style="font-size: 13px; font-weight: 600; display: block; margin-bottom: 6px;">
          Enter Current Password to Confirm Changes
        </label>
        <input type="password" id="inputCurrentPassword" placeholder="Enter current password" required />
      </div>
      <button type="submit" class="btn-save">Save Profile Changes</button>
    </div>

  </form>
</div>

<script>
  // Detect email across all nexusUser, user_email, or email keys
  const getActiveUserEmail = () => {
    // 1. Direct explicit keys
    let email = localStorage.getItem("user_email") || localStorage.getItem("email");

    // 2. Extract from nexusUser JSON object
    if (!email && localStorage.getItem("nexusUser")) {
      try {
        const userObj = JSON.parse(localStorage.getItem("nexusUser"));
        if (userObj && userObj.email) {
          email = userObj.email;
        }
      } catch (e) {
        console.error("Error parsing nexusUser:", e);
      }
    }

    return email ? email.trim() : "";
  };

  let activeEdits = new Set();
  let userEmail = "";

  async function loadProfileData() {
    userEmail = getActiveUserEmail();

    if (!userEmail) {
      document.getElementById("viewEmail").innerText = "Not Logged In";
      showAlert("Could not detect session email. Please log in again.", "danger");
      resetLoadingPlaceholders();
      return;
    }

    document.getElementById("viewEmail").innerText = userEmail;

    try {
      const res = await fetch(`/api/profile?email=${encodeURIComponent(userEmail)}`);
      const data = await res.json();

      if (data.success && data.profile) {
        const p = data.profile;

        // First Name
        document.getElementById("viewFirstName").innerText = p.first_name || "Not set";
        document.getElementById("inputFirstName").value = p.first_name || "";

        // Last Name
        document.getElementById("viewLastName").innerText = p.last_name || "Not set";
        document.getElementById("inputLastName").value = p.last_name || "";

        // Educational Level
        const eduType = p.educational_type || "secondary";
        document.getElementById("viewEduType").innerText = eduType === "tertiary" ? "Tertiary Institution" : "Secondary School";
        document.getElementById("inputEduType").value = eduType;

        // Secondary Class
        document.getElementById("viewClass").innerText = p.class || "Not set";
        if (p.class) document.getElementById("inputClass").value = p.class;

        // Tertiary Course
        document.getElementById("viewCourse").innerText = p.course || "Not set";
        document.getElementById("inputCourse").value = p.course || "";

        // Tertiary Level
        document.getElementById("viewLevel").innerText = p.level || "Not set";
        if (p.level) document.getElementById("inputLevel").value = p.level;

        handleEduTypeChange();
      } else {
        showAlert(data.error || "Profile details not found in database.", "danger");
        resetLoadingPlaceholders();
      }
    } catch (err) {
      console.error("Fetch profile error:", err);
      showAlert("Error connecting to server.", "danger");
      resetLoadingPlaceholders();
    }
  }

  function resetLoadingPlaceholders() {
    ["viewFirstName", "viewLastName", "viewEduType", "viewClass", "viewCourse", "viewLevel"].forEach(id => {
      const el = document.getElementById(id);
      if (el && el.innerText === "Loading...") {
        el.innerText = "Not set";
      }
    });
  }

  function toggleEdit(key) {
    const control = document.getElementById(`edit${key}`);
    const row = document.getElementById(`row${key}`);

    if (control.style.display === "block") {
      control.style.display = "none";
      row.classList.remove("editing");
      activeEdits.delete(key);
    } else {
      control.style.display = "block";
      row.classList.add("editing");
      activeEdits.add(key);
    }

    document.getElementById("saveSection").style.display = activeEdits.size > 0 ? "block" : "none";
  }

  function handleEduTypeChange() {
    const selectedType = document.getElementById("inputEduType").value;
    if (selectedType === "secondary") {
      document.getElementById("rowClass").style.display = "block";
      document.getElementById("rowCourse").style.display = "none";
      document.getElementById("rowLevel").style.display = "none";
    } else {
      document.getElementById("rowClass").style.display = "none";
      document.getElementById("rowCourse").style.display = "block";
      document.getElementById("rowLevel").style.display = "block";
    }
  }

  document.getElementById("profileForm").addEventListener("submit", async (e) => {
    e.preventDefault();

    const newPassword = document.getElementById("inputNewPassword").value;
    const confirmPassword = document.getElementById("inputConfirmPassword").value;

    if (activeEdits.has("Password") && newPassword !== confirmPassword) {
      showAlert("New password and confirm password do not match.", "danger");
      return;
    }

    const payload = {
      email: userEmail,
      currentPassword: document.getElementById("inputCurrentPassword").value,
      newPassword: activeEdits.has("Password") ? newPassword : null,
      first_name: document.getElementById("inputFirstName").value,
      last_name: document.getElementById("inputLastName").value,
      educational_type: document.getElementById("inputEduType").value,
      class: document.getElementById("inputClass").value,
      course: document.getElementById("inputCourse").value,
      level: document.getElementById("inputLevel").value
    };

    try {
      const res = await fetch("/api/profile", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      });

      const data = await res.json();

      if (data.success) {
        showAlert("Profile updated successfully!", "success");

        document.getElementById("inputCurrentPassword").value = "";
        document.getElementById("inputNewPassword").value = "";
        document.getElementById("inputConfirmPassword").value = "";

        document.querySelectorAll(".edit-control").forEach(el => el.style.display = "none");
        document.querySelectorAll(".field-row").forEach(el => el.classList.remove("editing"));
        document.getElementById("saveSection").style.display = "none";
        activeEdits.clear();

        loadProfileData();
      } else {
        showAlert(data.error || "Failed to update profile", "danger");
      }
    } catch (err) {
      showAlert("Network error. Please try again.", "danger");
    }
  });

  function showAlert(msg, type) {
    const box = document.getElementById("alertBox");
    box.className = `alert alert-${type}`;
    box.innerText = msg;
    box.style.display = "block";
  }

  // Load profile as soon as DOM content is available
  document.addEventListener("DOMContentLoaded", loadProfileData);
</script>

</body>
            </html>
