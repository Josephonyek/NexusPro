<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nexus Pro - My Profile</title>
  <style>
    :root {
      --primary: #0284c7;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #1e293b;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --lock: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
    body { background-color: var(--bg); color: var(--text); display: flex; justify-content: center; padding: 40px 20px; }

    .profile-card {
      background: var(--card-bg);
      width: 100%;
      max-width: 520px;
      padding: 32px;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.05);
      border: 1px solid var(--border);
    }

    h2 { color: var(--primary); font-size: 24px; margin-bottom: 6px; }
    p.subtitle { color: var(--text-muted); font-size: 14px; margin-bottom: 24px; }

    /* Field Card Row Structure */
    .field-row {
      background: #f8fafc;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px 16px;
      margin-bottom: 14px;
      transition: border-color 0.2s;
    }

    .field-row.editing {
      border-color: var(--primary);
      background: #ffffff;
    }

    .field-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .field-label {
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-muted);
    }

    .edit-btn {
      background: none;
      border: none;
      cursor: pointer;
      color: var(--primary);
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 13px;
      font-weight: 600;
      padding: 2px 6px;
      border-radius: 4px;
    }

    .edit-btn:hover { background-color: #e0f2fe; }

    .lock-badge {
      font-size: 12px;
      color: var(--lock);
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .view-value {
      font-size: 15px;
      font-weight: 600;
      color: var(--text);
      margin-top: 6px;
    }

    .edit-control {
      display: none;
      margin-top: 10px;
    }

    input, select {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 14px;
      outline: none;
      background-color: #ffffff;
    }

    input:focus, select:focus { border-color: var(--primary); }

    /* Save Footer Section */
    .save-section {
      display: none;
      margin-top: 24px;
      padding-top: 20px;
      border-top: 1px dashed var(--border);
    }

    .btn-save {
      width: 100%;
      padding: 14px;
      background-color: var(--primary);
      color: #fff;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 15px;
      margin-top: 10px;
    }

    .btn-save:hover { opacity: 0.95; }

    .alert {
      padding: 12px;
      border-radius: 8px;
      font-size: 14px;
      margin-bottom: 20px;
      display: none;
    }
    .alert-danger { background-color: #fef2f2; color: #dc2626; border: 1px solid #fecaca; }
    .alert-success { background-color: #f0fdf4; color: #16a34a; border: 1px solid #bbf7d0; }
  </style>
</head>
<body>

<div class="profile-card">
  <h2>Account Profile</h2>
  <p class="subtitle">View your details or click the pencil icon to edit.</p>

  <div id="alertBox" class="alert"></div>

  <form id="profileForm">
    <!-- 1. READ-ONLY EMAIL -->
    <div class="field-row">
      <div class="field-header">
        <span class="field-label">Email Address</span>
        <span class="lock-badge">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
          Locked
        </span>
      </div>
      <div class="view-value" id="viewEmail">Loading...</div>
    </div>

    <!-- 2. FIRST NAME -->
    <div class="field-row" id="rowFirstName">
      <div class="field-header">
        <span class="field-label">First Name</span>
        <button type="button" class="edit-btn" onclick="toggleEdit('FirstName')">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>
          Edit
        </button>
      </div>
      <div class="view-value" id="viewFirstName">-</div>
      <div class="edit-control" id="editFirstName">
        <input type="text" id="inputFirstName" placeholder="Enter first name" />
      </div>
    </div>

    <!-- 3. LAST NAME -->
    <div class="field-row" id="rowLastName">
      <div class="field-header">
        <span class="field-label">Last Name</span>
        <button type="button" class="edit-btn" onclick="toggleEdit('LastName')">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>
          Edit
        </button>
      </div>
      <div class="view-value" id="viewLastName">-</div>
      <div class="edit-control" id="editLastName">
        <input type="text" id="inputLastName" placeholder="Enter last name" />
      </div>
    </div>

    <!-- 4. EDUCATIONAL LEVEL -->
    <div class="field-row" id="rowEduType">
      <div class="field-header">
        <span class="field-label">Educational Level</span>
        <button type="button" class="edit-btn" onclick="toggleEdit('EduType')">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>
          Edit
        </button>
      </div>
      <div class="view-value" id="viewEduType">Secondary School</div>
      <div class="edit-control" id="editEduType">
        <select id="inputEduType" onchange="handleEduTypeChange()">
          <option value="secondary">Secondary School</option>
          <option value="tertiary">Tertiary Institution</option>
        </select>
      </div>
    </div>

    <!-- 5. SECONDARY CLASS -->
    <div class="field-row" id="rowClass">
      <div class="field-header">
        <span class="field-label">Class</span>
        <button type="button" class="edit-btn" onclick="toggleEdit('Class')">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>
          Edit
        </button>
      </div>
      <div class="view-value" id="viewClass">-</div>
      <div class="edit-control" id="editClass">
        <select id="inputClass">
          <option value="SS1">SS1</option>
          <option value="SS2">SS2</option>
          <option value="SS3">SS3</option>
          <option value="JSS3">JSS3</option>
        </select>
      </div>
    </div>

    <!-- 6. TERTIARY COURSE -->
    <div class="field-row" id="rowCourse" style="display: none;">
      <div class="field-header">
        <span class="field-label">Course of Study</span>
        <button type="button" class="edit-btn" onclick="toggleEdit('Course')">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>
          Edit
        </button>
      </div>
      <div class="view-value" id="viewCourse">-</div>
      <div class="edit-control" id="editCourse">
        <input type="text" id="inputCourse" placeholder="e.g. Computer Science" />
      </div>
    </div>

    <!-- 7. TERTIARY LEVEL -->
    <div class="field-row" id="rowLevel" style="display: none;">
      <div class="field-header">
        <span class="field-label">Level</span>
        <button type="button" class="edit-btn" onclick="toggleEdit('Level')">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>
          Edit
        </button>
      </div>
      <div class="view-value" id="viewLevel">-</div>
      <div class="edit-control" id="editLevel">
        <select id="inputLevel">
          <option value="100L">100 Level</option>
          <option value="200L">200 Level</option>
          <option value="300L">300 Level</option>
          <option value="400L">400 Level</option>
          <option value="500L">500 Level</option>
        </select>
      </div>
    </div>

    <!-- SAVE & PASSWORD CONFIRMATION SECTION -->
    <div class="save-section" id="saveSection">
      <div class="form-group">
        <label style="font-size: 13px; font-weight: 600; display: block; margin-bottom: 6px;">
          Confirm Current Password to Save Updates
        </label>
        <input type="password" id="currentPassword" placeholder="Enter current password" required />
      </div>
      <button type="submit" class="btn-save">Save Profile Updates</button>
    </div>

  </form>
</div>

<script>
  const activeUserEmail = localStorage.getItem("user_email") || "student@example.com";
  let editedFields = new Set();

  // Toggle Edit View for a specific field
  function toggleEdit(fieldKey) {
    const editControl = document.getElementById(`edit${fieldKey}`);
    const row = document.getElementById(`row${fieldKey}`);

    if (editControl.style.display === "block") {
      editControl.style.display = "none";
      row.classList.remove("editing");
      editedFields.delete(fieldKey);
    } else {
      editControl.style.display = "block";
      row.classList.add("editing");
      editedFields.add(fieldKey);
    }

    // Show password confirmation section if at least one field is in edit mode
    document.getElementById("saveSection").style.display = editedFields.size > 0 ? "block" : "none";
  }

  // Adjust visible academic rows based on Educational Type selection
  function handleEduTypeChange() {
    const selectedType = document.getElementById("inputEduType").value;
    if (selectedType === "secondary") {
      document.getElementById("rowClass").style.display = "block";
      document.getElementById("rowCourse").style.display = "none";
      document.getElementById("rowLevel").style.display = "none";
    } else {
      document.getElementById("rowClass").style.display = "none";
      document.getElementById("rowCourse").style.display = "block";
      document.getElementById("rowLevel").style.display = "block";
    }
  }

  // Fetch & display user profile data
  async function loadProfile() {
    document.getElementById("viewEmail").innerText = activeUserEmail;

    try {
      const res = await fetch(`/api/profile?email=${encodeURIComponent(activeUserEmail)}`);
      const data = await res.json();

      if (data.success && data.profile) {
        const p = data.profile;

        document.getElementById("viewFirstName").innerText = p.first_name || "Not set";
        document.getElementById("inputFirstName").value = p.first_name || "";

        document.getElementById("viewLastName").innerText = p.last_name || "Not set";
        document.getElementById("inputLastName").value = p.last_name || "";

        const eduType = p.educational_type || "secondary";
        document.getElementById("viewEduType").innerText = eduType === "tertiary" ? "Tertiary Institution" : "Secondary School";
        document.getElementById("inputEduType").value = eduType;

        if (p.class) {
          document.getElementById("viewClass").innerText = p.class;
          document.getElementById("inputClass").value = p.class;
        }

        if (p.course) {
          document.getElementById("viewCourse").innerText = p.course;
          document.getElementById("inputCourse").value = p.course;
        }

        if (p.level) {
          document.getElementById("viewLevel").innerText = p.level;
          document.getElementById("inputLevel").value = p.level;
        }

        handleEduTypeChange();
      }
    } catch (err) {
      showAlert("Failed to load profile data.", "danger");
    }
  }

  // Submit profile updates to API
  document.getElementById("profileForm").addEventListener("submit", async (e) => {
    e.preventDefault();

    const payload = {
      email: activeUserEmail,
      currentPassword: document.getElementById("currentPassword").value,
      first_name: document.getElementById("inputFirstName").value,
      last_name: document.getElementById("inputLastName").value,
      educational_type: document.getElementById("inputEduType").value,
      class: document.getElementById("inputClass").value,
      course: document.getElementById("inputCourse").value,
      level: document.getElementById("inputLevel").value
    };

    try {
      const res = await fetch("/api/profile", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      });

      const data = await res.json();

      if (data.success) {
        showAlert(data.message, "success");
        document.getElementById("currentPassword").value = "";
        
        // Hide all edit controls and reload updated values
        document.querySelectorAll(".edit-control").forEach(el => el.style.display = "none");
        document.querySelectorAll(".field-row").forEach(el => el.classList.remove("editing"));
        document.getElementById("saveSection").style.display = "none";
        editedFields.clear();

        loadProfile();
      } else {
        showAlert(data.error || "Failed to update profile", "danger");
      }
    } catch (err) {
      showAlert("Network error. Please try again.", "danger");
    }
  });

  function showAlert(msg, type) {
    const box = document.getElementById("alertBox");
    box.className = `alert alert-${type}`;
    box.innerText = msg;
    box.style.display = "block";
  }

  loadProfile();
</script>

</body>
        </html>
