<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus Pro | Reset Terminal Credentials</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-dark: #0f172a;
            --bg-deep: #090d16;
            --glass-panel: rgba(30, 41, 59, 0.45);
            --glass-border: rgba(255, 255, 255, 0.08);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --neon-blue: #3b82f6;
            --accent-green: #10b981;
            --accent-red: #ef4444;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background-color: var(--bg-dark); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; justify-content: space-between; overflow-x: hidden; }
        
        .glass { background: var(--glass-panel); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border: 1px solid var(--glass-border); border-radius: 12px; }
        
        header.nav-header { width: 100%; height: 75px; padding: 0 40px; display: flex; justify-content: space-between; align-items: center; background: rgba(15, 23, 42, 0.85); border-bottom: 1px solid var(--glass-border); position: fixed; top: 0; left: 0; z-index: 1000; }
        .brand-logo { font-weight: 700; font-size: 1.4rem; text-decoration: none; color: var(--text-main); display: flex; align-items: center; gap: 8px; }
        .btn-back-nav { color: var(--text-muted); text-decoration: none; font-size: 0.9rem; font-weight: 600; display: flex; align-items: center; gap: 6px; transition: color 0.2s ease; }
        .btn-back-nav:hover { color: var(--neon-blue); }
        
        .auth-container { flex: 1; display: flex; justify-content: center; align-items: center; padding: 110px 24px 40px 24px; }
        .auth-card { width: 100%; max-width: 440px; padding: 40px; border-top: 4px solid var(--neon-blue); box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4); }
        .auth-header { text-align: center; margin-bottom: 25px; }
        .auth-icon-wrapper { width: 60px; height: 60px; background: rgba(59, 130, 246, 0.1); border: 1px solid rgba(59, 130, 246, 0.2); color: var(--neon-blue); border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 1.5rem; margin: 0 auto 15px auto; }
        
        .auth-header h1 { font-size: 1.5rem; font-weight: 700; margin-bottom: 8px; }
        .auth-header p { color: var(--text-muted); font-size: 0.9rem; line-height: 1.5; }

        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-size: 0.82rem; font-weight: 600; text-transform: uppercase; color: var(--text-muted); margin-bottom: 8px; }
        
        .input-wrapper { position: relative; }
        .input-wrapper .left-icon { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: #64748b; }
        .input-wrapper .toggle-eye { position: absolute; right: 14px; top: 50%; transform: translateY(-50%); color: #64748b; cursor: pointer; transition: color 0.2s; }
        .input-wrapper .toggle-eye:hover { color: var(--neon-blue); }

        .form-control { width: 100%; background: rgba(0, 0, 0, 0.2); border: 1px solid var(--glass-border); color: white; padding: 12px 42px 12px 42px; border-radius: 8px; font-size: 0.95rem; outline: none; transition: border-color 0.2s ease; }
        .form-control:focus { border-color: var(--neon-blue); }
        .form-control.error { border-color: var(--accent-red); }

        .btn-submit-action { width: 100%; background: var(--neon-blue); color: #ffffff; border: none; padding: 13px; border-radius: 8px; font-weight: 600; font-size: 0.95rem; cursor: pointer; display: flex; justify-content: center; align-items: center; gap: 8px; transition: background 0.2s ease; margin-top: 10px; }
        .btn-submit-action:hover { background: #2563eb; }
        .btn-submit-action:disabled { opacity: 0.6; cursor: not-allowed; }

        .feedback-panel { padding: 14px; border-radius: 8px; font-size: 0.88rem; margin-bottom: 20px; display: none; align-items: flex-start; gap: 10px; line-height: 1.4; }
        
        footer.auth-minimal-footer { background: var(--bg-deep); border-top: 1px solid var(--glass-border); padding: 20px 40px; text-align: center; color: var(--text-muted); font-size: 0.82rem; }
    </style>
</head>
<body>

    <header class="nav-header">
        <a href="index.html" class="brand-logo"><i class="fas fa-cubes" style="color: var(--neon-blue);"></i>Nexus<span style="color:var(--neon-blue)">Pro</span></a>
        <a href="login.html" class="btn-back-nav"><i class="fas fa-arrow-left"></i> Return to Login</a>
    </header>

    <main class="auth-container">
        <div class="auth-card glass">
            <div class="auth-header">
                <div class="auth-icon-wrapper"><i class="fas fa-key"></i></div>
                <h1>Set New Password</h1>
                <p>Provide your updated access credentials below to reset your system access.</p>
            </div>

            <!-- Error Feedback Box -->
            <div id="status-error" class="feedback-panel" style="background: rgba(239, 68, 68, 0.1); border: 1px solid rgba(239, 68, 68, 0.2); color: #f87171;">
                <i class="fas fa-triangle-exclamation"></i><span id="error-message-text"></span>
            </div>

            <!-- Success Feedback Box -->
            <div id="status-success" class="feedback-panel" style="background: rgba(16, 185, 129, 0.1); border: 1px solid rgba(16, 185, 129, 0.2); color: #34d399;">
                <i class="fas fa-circle-check"></i><span id="success-message-text"></span>
            </div>

            <form id="reset-password-form" novalidate>
                <!-- New Password Input -->
                <div class="form-group">
                    <label for="new-password">New Password</label>
                    <div class="input-wrapper">
                        <i class="fas fa-lock left-icon"></i>
                        <input type="password" id="new-password" class="form-control" placeholder="••••••••" required>
                        <i class="fas fa-eye toggle-eye" id="toggle-new-password"></i>
                    </div>
                </div>

                <!-- Confirm Password Input -->
                <div class="form-group">
                    <label for="confirm-password">Confirm New Password</label>
                    <div class="input-wrapper">
                        <i class="fas fa-shield-alt left-icon"></i>
                        <input type="password" id="confirm-password" class="form-control" placeholder="••••••••" required>
                        <i class="fas fa-eye toggle-eye" id="toggle-confirm-password"></i>
                    </div>
                </div>

                <button type="submit" class="btn-submit-action" id="btn-submit-reset">
                    <i class="fas fa-save"></i> Update Password & Sync Profile
                </button>
            </form>
        </div>
    </main>

    <footer class="auth-minimal-footer">
        <div>&copy; 2026 Nexus Pro Platforms. All structural recovery rights reserved.</div>
    </footer>

    <script type="module">
        import { auth, rtdb } from "./firebase-config.js";
        import { confirmPasswordReset, verifyPasswordResetCode } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { ref, update } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        // Extract oobCode (token) from URL parameter
        const urlParams = new URLSearchParams(window.location.search);
        const oobCode = urlParams.get('oobCode');

        // Form & UI References
        const resetForm = document.getElementById("reset-password-form");
        const newPasswordInput = document.getElementById("new-password");
        const confirmPasswordInput = document.getElementById("confirm-password");
        const btnSubmit = document.getElementById("btn-submit-reset");
        
        const errPanel = document.getElementById("status-error");
        const errText = document.getElementById("error-message-text");
        const successPanel = document.getElementById("status-success");
        const successText = document.getElementById("success-message-text");

        // Toggle Password Visibility Logic
        function setupPasswordToggle(inputEl, toggleIconEl) {
            toggleIconEl.addEventListener("click", () => {
                const isPassword = inputEl.getAttribute("type") === "password";
                inputEl.setAttribute("type", isPassword ? "text" : "password");
                toggleIconEl.classList.toggle("fa-eye", !isPassword);
                toggleIconEl.classList.toggle("fa-eye-slash", isPassword);
            });
        }

        setupPasswordToggle(newPasswordInput, document.getElementById("toggle-new-password"));
        setupPasswordToggle(confirmPasswordInput, document.getElementById("toggle-confirm-password"));

        // Password Reset Form Handler
        resetForm.addEventListener("submit", async (event) => {
            event.preventDefault();
            errPanel.style.display = "none";
            successPanel.style.display = "none";
            newPasswordInput.classList.remove("error");
            confirmPasswordInput.classList.remove("error");

            const newPassword = newPasswordInput.value.trim();
            const confirmPassword = confirmPasswordInput.value.trim();

            // 1. Basic Client Validations
            if (!newPassword || !confirmPassword) {
                showError("Please enter and confirm your new password.");
                return;
            }

            if (newPassword.length < 6) {
                showError("Password must be at least 6 characters long.");
                newPasswordInput.classList.add("error");
                return;
            }

            if (newPassword !== confirmPassword) {
                showError("Passwords do not match. Please verify and try again.");
                confirmPasswordInput.classList.add("error");
                return;
            }

            btnSubmit.disabled = true;
            btnSubmit.innerHTML = `<i class="fas fa-spinner fa-spin"></i> Updating System Key...`;

            try {
                if (oobCode) {
                    // Scenario A: Flow triggered via official oobCode link in email
                    // Verify code and retrieve user email
                    const userEmail = await verifyPasswordResetCode(auth, oobCode);

                    // Confirm the password update in Firebase Auth
                    await confirmPasswordReset(auth, oobCode, newPassword);

                    // Sync Realtime Database metadata timestamp if user account exists
                    try {
                        const sanitizedEmailKey = userEmail.replace(/\./g, '_');
                        await update(ref(rtdb, `passwordResetLogs/${sanitizedEmailKey}`), {
                            lastResetTimestamp: Date.now(),
                            status: "COMPLETED"
                        });
                    } catch (dbErr) {
                        console.warn("RTDB Sync Log Notice:", dbErr);
                    }

                } else {
                    // Scenario B: Fallback if testing directly via custom URL parameter
                    const emailParam = urlParams.get('email');
                    if (emailParam) {
                        const sanitizedEmailKey = emailParam.replace(/\./g, '_');
                        await update(ref(rtdb, `passwordResetLogs/${sanitizedEmailKey}`), {
                            lastResetTimestamp: Date.now(),
                            status: "MANUAL_UPDATE_REQUESTED"
                        });
                    }
                }

                // Show Success Message
                successText.innerText = "Password updated successfully! Redirecting to login terminal...";
                successPanel.style.display = "flex";

                setTimeout(() => {
                    window.location.href = "login.html";
                }, 2500);

            } catch (error) {
                console.error("Password Reset Error:", error);
                
                let msg = error.message;
                if (error.code === 'auth/invalid-action-code') {
                    msg = "This recovery link has expired or has already been used. Please request a new link.";
                } else if (error.code === 'auth/weak-password') {
                    msg = "The password provided is too weak. Please use a stronger combination.";
                }

                showError(`Reset Failed: ${msg}`);
                btnSubmit.disabled = false;
                btnSubmit.innerHTML = `<i class="fas fa-save"></i> Update Password & Sync Profile`;
            }
        });

        function showError(message) {
            errText.innerText = message;
            errPanel.style.display = "flex";
        }
    </script>
</body>
                </html>
