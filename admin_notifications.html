<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Nexus Pro - Manage Notifications</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    :root { --bg-dark: #090d16; --card-bg: #131c2e; --card-border: #1e2d4a; --accent-blue: #38bdf8; --text-muted: #94a3b8; --danger: #ef4444; }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', system-ui, sans-serif; }
    body { background: var(--bg-dark); color: #fff; padding: 24px 16px; }
    .container { max-width: 900px; margin: 0 auto; display: grid; gap: 24px; }
    .card { background: var(--card-bg); border: 1px solid var(--card-border); padding: 20px; border-radius: 12px; }
    input, select, textarea { width: 100%; padding: 10px; background: var(--bg-dark); border: 1px solid var(--card-border); color: #fff; border-radius: 8px; margin-bottom: 12px; }
    .btn { padding: 8px 14px; border: none; border-radius: 6px; font-weight: 600; cursor: pointer; }
    .btn-primary { background: #0284c7; color: #fff; }
    .btn-action { padding: 4px 8px; font-size: 0.75rem; border: 1px solid var(--card-border); background: var(--bg-dark); color: #fff; border-radius: 4px; cursor: pointer; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 0.85rem; }
    td, th { padding: 10px; border-bottom: 1px solid var(--card-border); text-align: left; }
  </style>
</head>
<body>
  <div class="container">
    
    <!-- Send / Edit Form -->
    <div class="card">
      <h2 id="formTitle"><i class="fas fa-bullhorn" style="color:var(--accent-blue);"></i> Broadcast Notification</h2>
      <form id="notifForm">
        <input type="hidden" id="editId" value="">
        <input type="text" id="title" placeholder="Title / Subject" required>
        <textarea id="message" placeholder="Message Body..." required style="min-height:90px;"></textarea>
        <button type="submit" class="btn btn-primary" id="saveBtn">Publish Notification</button>
        <button type="button" class="btn" id="cancelBtn" style="display:none; background:transparent; color:var(--text-muted);" onclick="resetForm()">Cancel</button>
      </form>
    </div>

    <!-- Existing Notifications Table -->
    <div class="card">
      <h2>Existing Announcements</h2>
      <table>
        <thead>
          <tr>
            <th>Title</th>
            <th>Date</th>
            <th>Read Receipts</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="adminNotifTable">
          <tr><td colspan="4">Loading...</td></tr>
        </tbody>
      </table>
    </div>

  </div>

  <script>
    let notifs = [];

    async function loadAdminNotifs() {
      const res = await fetch('/api/notifications.js?action=admin-list');
      const data = await res.json();
      notifs = data.notifications || [];

      const tbody = document.getElementById("adminNotifTable");
      if (!notifs.length) { tbody.innerHTML = `<tr><td colspan="4">No notifications created yet.</td></tr>`; return; }

      tbody.innerHTML = notifs.map(n => `
        <tr>
          <td><strong>${escapeHtml(n.title)}</strong></td>
          <td>${new Date(Number(n.created_at)).toLocaleDateString()}</td>
          <td>
            <button class="btn-action" onclick="viewReads('${n.id}')">
              <i class="fas fa-eye"></i> ${n.read_count || 0} Seen
            </button>
          </td>
          <td>
            <button class="btn-action" onclick="editNotif('${n.id}')"><i class="fas fa-edit"></i> Edit</button>
            <button class="btn-action" style="color:var(--danger);" onclick="deleteNotif('${n.id}')"><i class="fas fa-trash"></i></button>
          </td>
        </tr>
      `).join("");
    }

    document.getElementById("notifForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const id = document.getElementById("editId").value;
      const title = document.getElementById("title").value.trim();
      const message = document.getElementById("message").value.trim();

      const action = id ? "edit-notification" : "send-notification";
      await fetch(`/api/notifications.js?action=${action}`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ id, recipientType: "all", title, message })
      });

      resetForm();
      loadAdminNotifs();
    });

    function editNotif(id) {
      const n = notifs.find(item => String(item.id) === String(id));
      if (!n) return;
      document.getElementById("editId").value = n.id;
      document.getElementById("title").value = n.title;
      document.getElementById("message").value = n.message;
      document.getElementById("formTitle").innerHTML = `<i class="fas fa-edit"></i> Edit Notification`;
      document.getElementById("saveBtn").textContent = "Save Changes";
      document.getElementById("cancelBtn").style.display = "inline-block";
    }

    async function deleteNotif(id) {
      if (!confirm("Delete this notification?")) return;
      await fetch('/api/notifications.js?action=delete-notification', {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ id })
      });
      loadAdminNotifs();
    }

    async function viewReads(id) {
      const res = await fetch(`/api/notifications.js?action=get-reads&id=${id}`);
      const data = await res.json();
      const readers = data.reads || [];
      if (!readers.length) { alert("No students have marked this notification as seen yet."); return; }
      
      const list = readers.map(r => `• ${r.student_email} (${new Date(Number(r.read_at)).toLocaleString()})`).join("\n");
      alert(`Students who saw this announcement:\n\n${list}`);
    }

    function resetForm() {
      document.getElementById("notifForm").reset();
      document.getElementById("editId").value = "";
      document.getElementById("formTitle").innerHTML = `<i class="fas fa-bullhorn" style="color:var(--accent-blue);"></i> Broadcast Notification`;
      document.getElementById("saveBtn").textContent = "Publish Notification";
      document.getElementById("cancelBtn").style.display = "none";
    }

    function escapeHtml(str) { return String(str||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
    loadAdminNotifs();
  </script>
</body>
</html>
