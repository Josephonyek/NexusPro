<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nexus Pro - Admin User Management</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    :root {
      --bg-main: #0b1120;
      --bg-secondary: #111827;
      --card-bg: #1e293b;
      --card-hover: #273549;
      --input-bg: #0f172a;
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
      --text-dim: #64748b;
      --accent: #38bdf8;
      --accent-soft: rgba(56, 189, 248, 0.12);
      --border: #334155;
      --border-light: #1e293b;
      --danger: #f87171;
      --danger-soft: rgba(248, 113, 113, 0.12);
      --warning: #fbbf24;
      --warning-soft: rgba(251, 191, 36, 0.12);
      --success: #4ade80;
      --success-soft: rgba(74, 222, 128, 0.12);
      --radius: 14px;
      --radius-sm: 8px;
      --shadow: 0 4px 24px rgba(0, 0, 0, 0.25);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Inter", sans-serif;
    }

    body {
      background: radial-gradient(ellipse at top, #111827 0%, #0b1120 60%);
      color: var(--text-main);
      min-height: 100vh;
      padding: 28px 20px 60px;
    }

    .admin-container {
      max-width: 1180px;
      margin: 0 auto;
    }

    /* ========== HEADER ========== */
    .admin-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
      margin-bottom: 32px;
    }

    .admin-title {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .admin-icon {
      width: 48px;
      height: 48px;
      border-radius: 14px;
      background: linear-gradient(135deg, #0ea5e9, #0284c7);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.25rem;
      box-shadow: 0 8px 20px rgba(14, 165, 233, 0.25);
    }

    .admin-title h1 {
      font-size: 1.65rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .admin-title p {
      color: var(--text-muted);
      font-size: 0.9rem;
      margin-top: 2px;
    }

    .btn-back {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 18px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--text-main);
      border-radius: 10px;
      font-size: 0.875rem;
      font-weight: 500;
      text-decoration: none;
      transition: all 0.2s ease;
    }

    .btn-back:hover {
      border-color: var(--accent);
      color: var(--accent);
      background: var(--accent-soft);
    }

    /* ========== STATS ========== */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
      margin-bottom: 28px;
    }

    .stat-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 22px 20px;
      display: flex;
      align-items: center;
      gap: 16px;
      transition: transform 0.2s ease, border-color 0.2s ease;
    }

    .stat-card:hover {
      transform: translateY(-2px);
      border-color: #475569;
    }

    .stat-icon {
      width: 46px;
      height: 46px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.15rem;
      flex-shrink: 0;
    }

    .stat-icon.total   { background: var(--accent-soft); color: var(--accent); }
    .stat-icon.students{ background: rgba(148, 163, 184, 0.12); color: #94a3b8; }
    .stat-icon.admins  { background: rgba(168, 85, 247, 0.12); color: #c084fc; }
    .stat-icon.suspended{ background: var(--danger-soft); color: var(--danger); }

    .stat-info h3 {
      font-size: 1.75rem;
      font-weight: 700;
      line-height: 1.1;
      letter-spacing: -0.03em;
    }

    .stat-info p {
      color: var(--text-muted);
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      margin-top: 2px;
    }

    /* ========== FILTERS ========== */
    .filters-bar {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 20px;
      background: var(--card-bg);
      padding: 14px 16px;
      border-radius: var(--radius);
      border: 1px solid var(--border);
    }

    .search-wrapper {
      flex: 2;
      min-width: 240px;
      position: relative;
    }

    .search-wrapper i {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-dim);
      font-size: 0.9rem;
    }

    .search-input {
      width: 100%;
      padding: 11px 14px 11px 40px;
      background: var(--input-bg);
      border: 1px solid var(--border);
      color: var(--text-main);
      border-radius: var(--radius-sm);
      font-size: 0.9rem;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .search-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-soft);
    }

    .filter-select {
      flex: 1;
      min-width: 150px;
      padding: 11px 14px;
      background: var(--input-bg);
      border: 1px solid var(--border);
      color: var(--text-main);
      border-radius: var(--radius-sm);
      font-size: 0.9rem;
      outline: none;
      cursor: pointer;
      transition: border-color 0.2s;
    }

    .filter-select:focus {
      border-color: var(--accent);
    }

    /* ========== TABLE ========== */
    .table-responsive {
      width: 100%;
      overflow-x: auto;
      background: var(--card-bg);
      border-radius: var(--radius);
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
    }

    .user-table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 0.9rem;
    }

    .user-table th {
      padding: 14px 20px;
      background: rgba(15, 23, 42, 0.5);
      color: var(--text-muted);
      font-weight: 600;
      text-transform: uppercase;
      font-size: 0.72rem;
      letter-spacing: 0.06em;
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
    }

    .user-table td {
      padding: 16px 20px;
      border-bottom: 1px solid var(--border-light);
      vertical-align: middle;
    }

    .user-table tr:last-child td {
      border-bottom: none;
    }

    .user-table tbody tr {
      transition: background 0.15s ease;
    }

    .user-table tbody tr:hover {
      background: rgba(56, 189, 248, 0.04);
    }

    .user-name {
      font-weight: 600;
      color: var(--text-main);
    }

    .user-email {
      color: var(--text-muted);
      font-size: 0.82rem;
      margin-top: 2px;
    }

    /* Badges */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 4px 11px;
      border-radius: 50px;
      font-size: 0.72rem;
      font-weight: 600;
      text-transform: capitalize;
      letter-spacing: 0.02em;
    }

    .badge.admin {
      background: rgba(168, 85, 247, 0.12);
      color: #c084fc;
      border: 1px solid rgba(168, 85, 247, 0.3);
    }

    .badge.student {
      background: rgba(148, 163, 184, 0.12);
      color: #94a3b8;
      border: 1px solid rgba(148, 163, 184, 0.25);
    }

    .badge.active {
      background: var(--success-soft);
      color: var(--success);
      border: 1px solid rgba(74, 222, 128, 0.3);
    }

    .badge.suspended {
      background: var(--danger-soft);
      color: var(--danger);
      border: 1px solid rgba(248, 113, 113, 0.3);
    }

    /* Action Buttons */
    .action-group {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 7px 12px;
      font-size: 0.78rem;
      font-weight: 600;
      border-radius: 7px;
      cursor: pointer;
      border: 1px solid var(--border);
      background: var(--input-bg);
      color: var(--text-main);
      transition: all 0.18s ease;
      white-space: nowrap;
    }

    .btn:hover {
      border-color: var(--accent);
      color: var(--accent);
      background: var(--accent-soft);
    }

    .btn.warn:hover {
      border-color: var(--warning);
      color: var(--warning);
      background: var(--warning-soft);
    }

    .btn.danger:hover {
      border-color: var(--danger);
      color: var(--danger);
      background: var(--danger-soft);
    }

    .self-label {
      color: var(--text-dim);
      font-size: 0.75rem;
      align-self: center;
      margin-left: 4px;
      font-style: italic;
    }

    /* Empty / Loading */
    .table-message {
      text-align: center;
      color: var(--text-muted);
      padding: 48px 24px !important;
    }

    /* ========== MODAL ========== */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(6px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 1000;
      animation: fadeIn 0.2s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .modal-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 28px;
      width: 100%;
      max-width: 540px;
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.4);
      animation: slideUp 0.25s ease;
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 6px;
    }

    .modal-header h3 {
      font-size: 1.25rem;
      font-weight: 700;
    }

    .modal-close {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--input-bg);
      color: var(--text-muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s;
    }

    .modal-close:hover {
      border-color: var(--danger);
      color: var(--danger);
    }

    .modal-email {
      color: var(--text-muted);
      font-size: 0.875rem;
      margin-bottom: 22px;
    }

    .modal-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .modal-field {
      background: var(--input-bg);
      padding: 12px 14px;
      border-radius: 10px;
      border: 1px solid var(--border);
    }

    .modal-field label {
      font-size: 0.68rem;
      color: var(--text-dim);
      display: block;
      margin-bottom: 3px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      font-weight: 600;
    }

    .modal-field span {
      font-weight: 600;
      font-size: 0.9rem;
      color: var(--text-main);
    }

    .modal-footer {
      margin-top: 24px;
      text-align: right;
    }

    .modal-footer .btn {
      padding: 9px 20px;
      font-size: 0.875rem;
    }

    /* Responsive */
    @media (max-width: 640px) {
      .modal-grid {
        grid-template-columns: 1fr;
      }
      .admin-title h1 {
        font-size: 1.35rem;
      }
      .stat-card {
        padding: 16px;
      }
    }
  </style>
</head>
<body>

  <div class="admin-container">

    <!-- Header -->
    <div class="admin-header">
      <div class="admin-title">
        <div class="admin-icon">
          <i class="fas fa-users-cog"></i>
        </div>
        <div>
          <h1>User Directory</h1>
          <p>Manage accounts, roles, and access permissions</p>
        </div>
      </div>
      <a href="dashboard.html" class="btn-back">
        <i class="fas fa-arrow-left"></i>
        Back to Dashboard
      </a>
    </div>

    <!-- Stats -->
    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-icon total"><i class="fas fa-users"></i></div>
        <div class="stat-info">
          <h3 id="statTotal">0</h3>
          <p>Total Users</p>
        </div>
      </div>
      <div class="stat-card">
        <div class="stat-icon students"><i class="fas fa-user-graduate"></i></div>
        <div class="stat-info">
          <h3 id="statStudents">0</h3>
          <p>Students</p>
        </div>
      </div>
      <div class="stat-card">
        <div class="stat-icon admins"><i class="fas fa-user-shield"></i></div>
        <div class="stat-info">
          <h3 id="statAdmins">0</h3>
          <p>Administrators</p>
        </div>
      </div>
      <div class="stat-card">
        <div class="stat-icon suspended"><i class="fas fa-user-slash"></i></div>
        <div class="stat-info">
          <h3 id="statSuspended">0</h3>
          <p>Suspended</p>
        </div>
      </div>
    </div>

    <!-- Filters -->
    <div class="filters-bar">
      <div class="search-wrapper">
        <i class="fas fa-search"></i>
        <input type="text" id="searchInput" class="search-input" placeholder="Search by name or email...">
      </div>

      <select id="roleFilter" class="filter-select">
        <option value="all">All Roles</option>
        <option value="student">Students</option>
        <option value="admin">Admins</option>
      </select>

      <select id="statusFilter" class="filter-select">
        <option value="all">All Statuses</option>
        <option value="active">Active</option>
        <option value="suspended">Suspended</option>
      </select>
    </div>

    <!-- Table -->
    <div class="table-responsive">
      <table class="user-table">
        <thead>
          <tr>
            <th>User Details</th>
            <th>Role</th>
            <th>Status</th>
            <th>Registered</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="userTableBody">
          <tr>
            <td colspan="5" class="table-message">
              <i class="fas fa-spinner fa-spin" style="margin-right: 8px;"></i>
              Loading user records...
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <!-- User Details Modal -->
  <div id="userModal" class="modal-overlay" style="display: none;">
    <div class="modal-card">
      <div class="modal-header">
        <h3 id="modalUserName">User Profile</h3>
        <button type="button" id="closeModalBtn" class="modal-close">
          <i class="fas fa-times"></i>
        </button>
      </div>
      <p id="modalUserEmail" class="modal-email"></p>

      <div class="modal-grid">
        <div class="modal-field">
          <label>User ID</label>
          <span id="modalUserId">-</span>
        </div>
        <div class="modal-field">
          <label>Role</label>
          <span id="modalUserRole">-</span>
        </div>
        <div class="modal-field">
          <label>Status</label>
          <span id="modalUserStatus">-</span>
        </div>
        <div class="modal-field">
          <label>Education Type</label>
          <span id="modalUserEdu">-</span>
        </div>
        <div class="modal-field">
          <label>Class / Target Exam</label>
          <span id="modalUserClass">-</span>
        </div>
        <div class="modal-field">
          <label>Course / Major</label>
          <span id="modalUserCourse">-</span>
        </div>
        <div class="modal-field">
          <label>Level</label>
          <span id="modalUserLevel">-</span>
        </div>
        <div class="modal-field">
          <label>Joined Date</label>
          <span id="modalUserJoined">-</span>
        </div>
      </div>

      <div class="modal-footer">
        <button type="button" id="closeModalBtn2" class="btn">Close</button>
      </div>
    </div>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const API_ENDPOINT = "/api/user-auth.js";
      const userTableBody = document.getElementById("userTableBody");
      const searchInput = document.getElementById("searchInput");
      const roleFilter = document.getElementById("roleFilter");
      const statusFilter = document.getElementById("statusFilter");

      const statTotal = document.getElementById("statTotal");
      const statStudents = document.getElementById("statStudents");
      const statAdmins = document.getElementById("statAdmins");
      const statSuspended = document.getElementById("statSuspended");

      const userModal = document.getElementById("userModal");
      const closeModalBtn = document.getElementById("closeModalBtn");
      const closeModalBtn2 = document.getElementById("closeModalBtn2");

      let allUsers = [];

      // 1. Check Access
      function checkAdminAccess() {
        const role = (localStorage.getItem("userRole") || "").toLowerCase();
        const token = localStorage.getItem("nexusToken") || localStorage.getItem("token");

        if (!token || role !== "admin") {
          alert("Access Denied: Admin authorization required.");
          window.location.href = "dashboard.html";
        }
      }
      checkAdminAccess();

      // 2. Fetch Users
      async function fetchUsers() {
        try {
          const token = localStorage.getItem("nexusToken") || localStorage.getItem("token");
          const res = await fetch(`${API_ENDPOINT}?action=list-users`, {
            headers: { "Authorization": `Bearer ${token}` }
          });

          if (!res.ok) throw new Error("Failed to fetch registry.");

          const data = await res.json();
          allUsers = data.users || [];

          updateStats(allUsers);
          renderUsers(allUsers);
        } catch (err) {
          console.error(err);
          userTableBody.innerHTML = `
            <tr>
              <td colspan="5" class="table-message" style="color: var(--danger);">
                <i class="fas fa-exclamation-circle" style="margin-right: 8px;"></i>
                Error loading user directory.
              </td>
            </tr>
          `;
        }
      }

      // 3. Stats Calculator
      function updateStats(users) {
        if (statTotal) statTotal.textContent = users.length;
        if (statStudents) statStudents.textContent = users.filter(u => u.role === "student").length;
        if (statAdmins) statAdmins.textContent = users.filter(u => u.role === "admin").length;
        if (statSuspended) statSuspended.textContent = users.filter(u => u.status === "suspended").length;
      }

      // 4. Render Table Data
      function renderUsers(users) {
        if (users.length === 0) {
          userTableBody.innerHTML = `
            <tr>
              <td colspan="5" class="table-message">
                <i class="fas fa-search" style="margin-right: 8px;"></i>
                No matching accounts found.
              </td>
            </tr>
          `;
          return;
        }

        const currentEmail = getActiveUserEmail();

        userTableBody.innerHTML = users.map(user => {
          const isSelf = user.email.toLowerCase() === currentEmail.toLowerCase();
          const nextRole = user.role === "admin" ? "student" : "admin";
          const isSuspended = user.status === "suspended";
          const formattedDate = user.created_at ? new Date(Number(user.created_at)).toLocaleDateString() : "N/A";

          return `
            <tr>
              <td>
                <div class="user-name">${escapeHtml(user.name || "Unnamed Account")}</div>
                <div class="user-email">${escapeHtml(user.email)}</div>
              </td>
              <td><span class="badge ${user.role}">${user.role}</span></td>
              <td><span class="badge ${isSuspended ? "suspended" : "active"}">${isSuspended ? "Suspended" : "Active"}</span></td>
              <td style="color: var(--text-muted); font-size: 0.85rem;">${formattedDate}</td>
              <td>
                <div class="action-gr
