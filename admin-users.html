<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nexus Pro - User Management</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .admin-container {
      padding: 24px;
      max-width: 1200px;
      margin: 0 auto;
    }

    .admin-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
      margin-bottom: 24px;
    }

    .admin-title h1 {
      margin: 0 0 4px 0;
      font-size: 1.75rem;
    }

    .admin-title p {
      margin: 0;
      color: var(--text-muted);
    }

    /* Stats Overview */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
      margin-bottom: 24px;
    }

    .stat-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      padding: 16px;
      text-align: center;
    }

    .stat-card h3 {
      margin: 0;
      font-size: 1.8rem;
      color: var(--accent);
    }

    .stat-card p {
      margin: 4px 0 0 0;
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    /* Filters Bar */
    .filters-bar {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 20px;
      background: var(--card-bg);
      padding: 16px;
      border-radius: var(--radius);
      border: 1px solid var(--border-color);
    }

    .search-input {
      flex: 2;
      min-width: 220px;
    }

    .filter-select {
      flex: 1;
      min-width: 150px;
    }

    /* User Table */
    .table-responsive {
      width: 100%;
      overflow-x: auto;
      background: var(--card-bg);
      border-radius: var(--radius);
      border: 1px solid var(--border-color);
    }

    .user-table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 0.9rem;
    }

    .user-table th, 
    .user-table td {
      padding: 14px 18px;
      border-bottom: 1px solid var(--border-color);
    }

    .user-table th {
      background: var(--input-bg);
      color: var(--text-muted);
      font-weight: 600;
      text-transform: uppercase;
      font-size: 0.75rem;
      letter-spacing: 0.05em;
    }

    .user-table tr:last-child td {
      border-bottom: none;
    }

    /* Badges */
    .badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 50px;
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: capitalize;
    }

    .badge.admin {
      background: rgba(56, 189, 248, 0.15);
      color: var(--accent);
      border: 1px solid var(--accent);
    }

    .badge.student {
      background: rgba(148, 163, 184, 0.15);
      color: var(--text-muted);
      border: 1px solid var(--border-color);
    }

    .badge.active {
      background: rgba(34, 197, 94, 0.15);
      color: #22c55e;
      border: 1px solid #22c55e;
    }

    .badge.suspended {
      background: rgba(239, 68, 68, 0.15);
      color: #ef4444;
      border: 1px solid #ef4444;
    }

    /* Actions Grid */
    .action-group {
      display: flex;
      gap: 6px;
    }

    .btn-action {
      padding: 6px 10px;
      font-size: 0.75rem;
      border-radius: 6px;
      cursor: pointer;
      border: 1px solid var(--border-color);
      background: var(--input-bg);
      color: var(--text-main);
      transition: all 0.2s ease;
    }

    .btn-action:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .btn-action.warn:hover {
      border-color: #f59e0b;
      color: #f59e0b;
    }

    .btn-action.danger:hover {
      border-color: #ef4444;
      color: #ef4444;
    }

    /* Info Drawer / Modal */
    .modal-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 16px;
    }

    .modal-field {
      background: var(--input-bg);
      padding: 10px;
      border-radius: 6px;
      border: 1px solid var(--border-color);
    }

    .modal-field label {
      font-size: 0.75rem;
      color: var(--text-muted);
      display: block;
      margin-bottom: 2px;
    }

    .modal-field span {
      font-weight: 600;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>

  <div class="admin-container">
    <!-- Top Header -->
    <div class="admin-header">
      <div class="admin-title">
        <h1>User Directory</h1>
        <p>Manage permissions, inspect profile data, suspend accounts, or delete users.</p>
      </div>
      <a href="dashboard.html" class="btn-action">← Back to Dashboard</a>
    </div>

    <!-- Quick Stats -->
    <div class="stats-grid">
      <div class="stat-card">
        <h3 id="statTotal">0</h3>
        <p>Total Registered Users</p>
      </div>
      <div class="stat-card">
        <h3 id="statStudents">0</h3>
        <p>Students</p>
      </div>
      <div class="stat-card">
        <h3 id="statAdmins">0</h3>
        <p>Administrators</p>
      </div>
      <div class="stat-card">
        <h3 id="statSuspended">0</h3>
        <p>Suspended Accounts</p>
      </div>
    </div>

    <!-- Filters & Search -->
    <div class="filters-bar">
      <input type="text" id="searchInput" class="search-input form-group input" placeholder="Search by name or email...">
      
      <select id="roleFilter" class="filter-select form-group select">
        <option value="all">All Roles</option>
        <option value="student">Students</option>
        <option value="admin">Admins</option>
      </select>

      <select id="statusFilter" class="filter-select form-group select">
        <option value="all">All Statuses</option>
        <option value="active">Active</option>
        <option value="suspended">Suspended</option>
      </select>
    </div>

    <!-- User Data Table -->
    <div class="table-responsive">
      <table class="user-table">
        <thead>
          <tr>
            <th>User</th>
            <th>Role</th>
            <th>Status</th>
            <th>Registered</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="userTableBody">
          <tr>
            <td colspan="5" style="text-align: center; padding: 24px; color: var(--text-muted);">
              Loading user registry...
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <!-- USER DETAILS MODAL -->
  <div id="userModal" class="modal-overlay" style="display: none;">
    <div class="modal-card" style="max-width: 500px;">
      <h3 id="modalUserName">User Details</h3>
      <p id="modalUserEmail" style="color: var(--text-muted); font-size: 0.85rem; margin-top: -4px;"></p>
      
      <div class="modal-grid">
        <div class="modal-field">
          <label>User ID</label>
          <span id="modalUserId">-</span>
        </div>
        <div class="modal-field">
          <label>Role</label>
          <span id="modalUserRole">-</span>
        </div>
        <div class="modal-field">
          <label>Status</label>
          <span id="modalUserStatus">-</span>
        </div>
        <div class="modal-field">
          <label>Education Type</label>
          <span id="modalUserEdu">-</span>
        </div>
        <div class="modal-field">
          <label>Class / Target Exam</label>
          <span id="modalUserClass">-</span>
        </div>
        <div class="modal-field">
          <label>Course / Major</label>
          <span id="modalUserCourse">-</span>
        </div>
        <div class="modal-field">
          <label>Level</label>
          <span id="modalUserLevel">-</span>
        </div>
        <div class="modal-field">
          <label>Joined Date</label>
          <span id="modalUserJoined">-</span>
        </div>
      </div>

      <div class="modal-actions" style="margin-top: 24px;">
        <button type="button" id="closeModalBtn" class="btn-secondary">Close</button>
      </div>
    </div>
  </div>

  <script src="admin-users.js"></script>
</body>
</html>
