<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nexus Pro - User Management</title>
  <link rel="stylesheet" href="style.css">
  <style>
    /* User Management Specific Styling */
    .admin-container {
      padding: 24px;
      max-width: 1200px;
      margin: 0 auto;
    }

    .admin-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
      margin-bottom: 24px;
    }

    .admin-title h1 {
      margin: 0 0 4px 0;
      font-size: 1.75rem;
    }

    .admin-title p {
      margin: 0;
      color: var(--text-muted);
    }

    /* Filters Bar */
    .filters-bar {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 20px;
      background: var(--card-bg);
      padding: 16px;
      border-radius: var(--radius);
      border: 1px solid var(--border-color);
    }

    .search-input {
      flex: 2;
      min-width: 220px;
    }

    .filter-select {
      flex: 1;
      min-width: 150px;
    }

    /* User Table */
    .table-responsive {
      width: 100%;
      overflow-x: auto;
      background: var(--card-bg);
      border-radius: var(--radius);
      border: 1px solid var(--border-color);
    }

    .user-table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 0.9rem;
    }

    .user-table th, 
    .user-table td {
      padding: 14px 18px;
      border-bottom: 1px solid var(--border-color);
    }

    .user-table th {
      background: var(--input-bg);
      color: var(--text-muted);
      font-weight: 600;
      text-transform: uppercase;
      font-size: 0.75rem;
      letter-spacing: 0.05em;
    }

    .user-table tr:last-child td {
      border-bottom: none;
    }

    .role-badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 50px;
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: capitalize;
    }

    .role-badge.admin {
      background: rgba(56, 189, 248, 0.15);
      color: var(--accent);
      border: 1px solid var(--accent);
    }

    .role-badge.student {
      background: rgba(148, 163, 184, 0.15);
      color: var(--text-muted);
      border: 1px solid var(--border-color);
    }

    .action-btn {
      padding: 6px 12px;
      font-size: 0.8rem;
      border-radius: 6px;
      cursor: pointer;
      border: 1px solid var(--border-color);
      background: var(--input-bg);
      color: var(--text-main);
      transition: all 0.2s ease;
    }

    .action-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .action-btn.danger:hover {
      border-color: var(--danger);
      color: var(--danger);
    }
  </style>
</head>
<body>

  <div class="admin-container">
    <!-- Navigation / Top Header -->
    <div class="admin-header">
      <div class="admin-title">
        <h1>User Management</h1>
        <p>View, promote, or manage registered students and platform administrators.</p>
      </div>
      <a href="dashboard.html" class="action-btn">← Back to Dashboard</a>
    </div>

    <!-- Filters & Search -->
    <div class="filters-bar">
      <input type="text" id="searchInput" class="search-input form-group input" placeholder="Search by name or email...">
      
      <select id="roleFilter" class="filter-select form-group select">
        <option value="all">All Roles</option>
        <option value="student">Students</option>
        <option value="admin">Admins</option>
      </select>

      <select id="categoryFilter" class="filter-select form-group select">
        <option value="all">All Categories</option>
        <option value="secondary">Secondary (WAEC/JAMB)</option>
        <option value="tertiary">Tertiary / University</option>
      </select>
    </div>

    <!-- User Data Table -->
    <div class="table-responsive">
      <table class="user-table">
        <thead>
          <tr>
            <th>Name</th>
            <th>Email</th>
            <th>Education Level</th>
            <th>Role</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="userTableBody">
          <!-- Dynamically populated by JS -->
          <tr>
            <td colspan="5" style="text-align: center; padding: 24px; color: var(--text-muted);">
              Loading user registry...
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <script src="admin-users.js"></script>
</body>
    </html>
