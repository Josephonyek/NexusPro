<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nexus Pro - Book Upload Manager</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    :root {
      --bg-dark: #090d16;
      --card-bg: #131c2e;
      --card-border: #1e2d4a;
      --accent-blue: #38bdf8;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --radius: 12px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', system-ui, sans-serif; }
    body { background: var(--bg-dark); color: var(--text-main); min-height: 100vh; padding: 24px 16px; }
    .container { max-width: 600px; margin: 0 auto; }
    .card { background: var(--card-bg); border: 1px solid var(--card-border); padding: 28px; border-radius: var(--radius); }
    h1 { font-size: 1.4rem; margin-bottom: 20px; display: flex; align-items: center; gap: 10px; }
    .form-group { margin-bottom: 16px; }
    label { display: block; font-size: 0.8rem; color: var(--text-muted); text-transform: uppercase; margin-bottom: 6px; font-weight: 600; }
    input, select { width: 100%; padding: 12px; background: var(--bg-dark); border: 1px solid var(--card-border); color: #fff; border-radius: 8px; outline: none; }
    input:focus, select:focus { border-color: var(--accent-blue); }
    .btn-submit { width: 100%; padding: 12px; background: #0284c7; color: #fff; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; transition: 0.2s; margin-top: 10px; }
    .btn-submit:hover { background: #0369a1; }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <h1><i class="fas fa-book-medical" style="color: var(--accent-blue);"></i> Add New Book</h1>
      <form id="bookUploadForm">
        <div class="form-group">
          <label for="bookTitle">Book Title *</label>
          <input type="text" id="bookTitle" placeholder="e.g., Fundamentals of Physics" required>
        </div>
        <div class="form-group">
          <label for="bookAuthor">Author / Publisher</label>
          <input type="text" id="bookAuthor" placeholder="e.g., Dr. A. Johnson">
        </div>
        <div class="form-group">
          <label for="bookCategory">Category / Subject</label>
          <select id="bookCategory">
            <option value="Physics">Physics</option>
            <option value="Chemistry">Chemistry</option>
            <option value="Mathematics">Mathematics</option>
            <option value="English">English</option>
            <option value="General">General</option>
          </select>
        </div>
        <div class="form-group">
          <label for="bookFileUrl">PDF / Resource Direct Link *</label>
          <input type="url" id="bookFileUrl" placeholder="https://drive.google.com/... or direct PDF link" required>
        </div>
        <div class="form-group">
          <label for="bookCoverUrl">Cover Image URL (Optional)</label>
          <input type="url" id="bookCoverUrl" placeholder="https://.../cover.jpg">
        </div>
        <button type="submit" class="btn-submit" id="submitBtn">
          <i class="fas fa-upload"></i> Publish to Academy
        </button>
      </form>
    </div>
  </div>
  <script src="admin_books.js"></script>
</body>
</html>
