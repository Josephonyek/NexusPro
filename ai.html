<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus AI - Nexus Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        /* Chat bubble styles */
        .chat-bubble-user {
            background: #2563eb;
            color: white;
            border-radius: 20px 20px 5px 20px;
            animation: slideInRight 0.35s ease-out forwards;
        }
        .chat-bubble-ai {
            background: #1f2937;
            border-radius: 20px 20px 20px 5px;
            animation: slideInLeft 0.35s ease-out forwards;
        }

        /* Message entrance animations */
        @keyframes slideInRight {
            from {
                opacity: 0;
                transform: translateX(30px) scale(0.95);
            }
            to {
                opacity: 1;
                transform: translateX(0) scale(1);
            }
        }
        @keyframes slideInLeft {
            from {
                opacity: 0;
                transform: translateX(-30px) scale(0.95);
            }
            to {
                opacity: 1;
                transform: translateX(0) scale(1);
            }
        }

        /* Smooth fade for welcome message */
        .welcome-msg {
            animation: fadeInUp 0.6s ease-out forwards;
        }
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Typing indicator dots */
        .typing-indicator {
            display: flex;
            align-items: center;
            gap: 5px;
            padding: 12px 18px;
            background: #1f2937;
            border-radius: 20px 20px 20px 5px;
            width: fit-content;
            animation: slideInLeft 0.3s ease-out;
        }
        .typing-dot {
            width: 8px;
            height: 8px;
            background: #9ca3af;
            border-radius: 50%;
            animation: typingBounce 1.4s infinite ease-in-out;
        }
        .typing-dot:nth-child(1) { animation-delay: 0s; }
        .typing-dot:nth-child(2) { animation-delay: 0.2s; }
        .typing-dot:nth-child(3) { animation-delay: 0.4s; }

        @keyframes typingBounce {
            0%, 60%, 100% {
                transform: translateY(0);
                opacity: 0.4;
            }
            30% {
                transform: translateY(-8px);
                opacity: 1;
            }
        }

        /* Send button micro-interaction */
        .send-btn {
            transition: all 0.2s ease;
        }
        .send-btn:active {
            transform: scale(0.92);
        }
        .send-btn:hover {
            box-shadow: 0 0 20px rgba(37, 99, 235, 0.5);
        }

        /* Smooth scrollbar */
        #chatArea::-webkit-scrollbar {
            width: 6px;
        }
        #chatArea::-webkit-scrollbar-track {
            background: transparent;
        }
        #chatArea::-webkit-scrollbar-thumb {
            background: #374151;
            border-radius: 10px;
        }
        #chatArea::-webkit-scrollbar-thumb:hover {
            background: #4b5563;
        }

        /* Input focus glow */
        #questionInput:focus {
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.25);
            transition: box-shadow 0.2s ease;
        }
    </style>
</head>
<body class="bg-gray-950 text-white min-h-screen">

    <nav class="bg-gray-900 border-b border-gray-800 px-6 py-4 flex items-center">
        <button onclick="window.location.href='dashboard.html'" class="mr-4 text-2xl hover:text-blue-400 transition-colors">←</button>
        <h1 class="text-xl font-bold">Nexus AI</h1>
    </nav>

    <div class="max-w-4xl mx-auto px-4 py-6">

        <!-- Chat Area -->
        <div id="chatArea" class="h-[70vh] overflow-y-auto bg-gray-900 rounded-3xl p-5 space-y-4 border border-gray-800 mb-6 scroll-smooth">
            <div class="text-center text-gray-500 text-sm py-10 welcome-msg">
                👋 Hi! I'm Nexus AI.<br>
                Ask me anything about STEM topics.
            </div>
        </div>

        <!-- Input -->
        <div class="flex gap-3">
            <input id="questionInput" type="text" 
                   placeholder="Ask a question (e.g. Explain photosynthesis)"
                   class="flex-1 bg-gray-800 border border-gray-700 rounded-2xl px-5 py-4 focus:outline-none focus:border-blue-500 transition-all">
            <button onclick="sendQuestion()" class="send-btn bg-blue-600 hover:bg-blue-700 px-8 rounded-2xl font-semibold">
                <i class="fas fa-paper-plane"></i>
            </button>
        </div>
    </div>

    <script src="ai-solver.js"></script>
</body>
                </html>
