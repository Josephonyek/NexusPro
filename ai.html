<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus AI - Nexus Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <script>
  (function requireAuth() {
    const token = localStorage.getItem("nexusToken");
    const user = localStorage.getItem("nexusUser");

    // If no token or user object exists in localStorage, bounce to login
    if (!token || !user) {
      alert("Please log in to access this page.");
      window.location.href = "auth.html";
    }
  })();
    </script>
    <style>
        /* Page background */
        body {
            background: radial-gradient(ellipse at top, #111827 0%, #030712 70%);
        }

        /* Chat bubbles */
        .chat-bubble-user {
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            color: white;
            border-radius: 20px 20px 5px 20px;
            animation: slideInRight 0.35s ease-out forwards;
            box-shadow: 0 4px 15px rgba(37, 99, 235, 0.25);
        }
        .chat-bubble-ai {
            background: #1f2937;
            border-radius: 20px 20px 20px 5px;
            animation: slideInLeft 0.35s ease-out forwards;
            border: 1px solid #374151;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        /* Message entrance animations */
        @keyframes slideInRight {
            from { opacity: 0; transform: translateX(30px) scale(0.95); }
            to   { opacity: 1; transform: translateX(0) scale(1); }
        }
        @keyframes slideInLeft {
            from { opacity: 0; transform: translateX(-30px) scale(0.95); }
            to   { opacity: 1; transform: translateX(0) scale(1); }
        }

        /* Welcome message */
        .welcome-msg {
            animation: fadeInUp 0.7s ease-out forwards;
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(25px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        /* Typing indicator */
        .typing-indicator {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 14px 20px;
            background: #1f2937;
            border-radius: 20px 20px 20px 5px;
            width: fit-content;
            border: 1px solid #374151;
            animation: slideInLeft 0.3s ease-out;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }
        .typing-dot {
            width: 9px;
            height: 9px;
            background: #60a5fa;
            border-radius: 50%;
            animation: typingBounce 1.4s infinite ease-in-out;
        }
        .typing-dot:nth-child(1) { animation-delay: 0s; }
        .typing-dot:nth-child(2) { animation-delay: 0.2s; }
        .typing-dot:nth-child(3) { animation-delay: 0.4s; }

        @keyframes typingBounce {
            0%, 60%, 100% { transform: translateY(0); opacity: 0.35; }
            30% { transform: translateY(-9px); opacity: 1; }
        }

        /* Input area */
        .input-wrapper {
            background: #111827;
            border: 1px solid #1f2937;
            border-radius: 24px;
            padding: 6px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.35);
            transition: border-color 0.25s ease, box-shadow 0.25s ease;
        }
        .input-wrapper:focus-within {
            border-color: #3b82f6;
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.15), 0 8px 30px rgba(0, 0, 0, 0.35);
        }
        #questionInput {
            background: transparent;
            border: none;
            outline: none;
            color: white;
        }
        #questionInput::placeholder {
            color: #6b7280;
        }

        /* Send button */
        .send-btn {
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            transition: all 0.2s ease;
            box-shadow: 0 4px 15px rgba(37, 99, 235, 0.3);
        }
        .send-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(37, 99, 235, 0.45);
        }
        .send-btn:active {
            transform: scale(0.94);
        }

        /* Chat area scrollbar */
        #chatArea::-webkit-scrollbar { width: 6px; }
        #chatArea::-webkit-scrollbar-track { background: transparent; }
        #chatArea::-webkit-scrollbar-thumb {
            background: #374151;
            border-radius: 10px;
        }
        #chatArea::-webkit-scrollbar-thumb:hover { background: #4b5563; }

        /* Subtle nav glow */
        nav {
            backdrop-filter: blur(12px);
            background: rgba(17, 24, 39, 0.85);
        }
    </style>
</head>
<body class="text-white min-h-screen">

    <!-- Navbar -->
    <nav class="border-b border-gray-800 px-6 py-4 flex items-center sticky top-0 z-50">
        <button onclick="window.location.href='dashboard.html'" class="mr-4 text-2xl text-gray-400 hover:text-blue-400 transition-colors">
            ←
        </button>
        <div class="flex items-center gap-3">
            <div class="w-9 h-9 rounded-xl bg-gradient-to-br from-blue-500 to-blue-700 flex items-center justify-center shadow-lg shadow-blue-500/30">
                <i class="fas fa-robot text-sm"></i>
            </div>
            <h1 class="text-xl font-bold tracking-tight">Nexus AI</h1>
        </div>
        <!-- Inside the navbar, after the title -->
<button onclick="downloadChatAsPDF()" 
        class="ml-auto flex items-center gap-2 text-sm bg-gray-800 hover:bg-gray-700 px-4 py-2 rounded-xl transition-colors">
    <i class="fas fa-file-pdf text-red-400"></i>
    <span class="hidden sm:inline">Download PDF</span>
</button>
    </nav>

    <div class="max-w-3xl mx-auto px-4 py-6">

        <!-- Chat Area -->
        <div id="chatArea" class="h-[68vh] overflow-y-auto bg-gray-900/60 rounded-3xl p-5 space-y-5 border border-gray-800/80 mb-6 scroll-smooth backdrop-blur-sm">
            
            <!-- Welcome -->
            <div class="text-center text-gray-500 text-sm py-12 welcome-msg">
                <div class="w-16 h-16 mx-auto mb-4 rounded-2xl bg-gradient-to-br from-blue-500/20 to-blue-700/20 border border-blue-500/30 flex items-center justify-center">
                    <i class="fas fa-robot text-2xl text-blue-400"></i>
                </div>
                <p class="text-gray-300 font-medium text-base mb-1">Hi! I'm Nexus AI</p>
                <p class="text-gray-500">Ask me anything about STEM topics.</p>
            </div>

            <!-- Typing indicator (hidden by default – show with JS) -->
            <div id="typingIndicator" class="typing-indicator hidden">
                <div class="typing-dot"></div>
                <div class="typing-dot"></div>
                <div class="typing-dot"></div>
            </div>
        </div>

        <!-- Input Area -->
        <div class="input-wrapper flex items-center gap-2">
            <input id="questionInput" type="text" 
                   placeholder="Ask a question (e.g. Explain photosynthesis)..."
                   class="flex-1 px-5 py-3.5 text-[15px]">
            <button onclick="sendQuestion()" class="send-btn w-12 h-12 rounded-2xl flex items-center justify-center text-white">
                <i class="fas fa-paper-plane text-sm"></i>
            </button>
        </div>
    </div>

    <script src="ai-solver.js"></script>

    <!-- Helper: how to toggle typing indicator from your JS -->
    <script>
        // Example usage inside ai-solver.js:
        // document.getElementById('typingIndicator').classList.remove('hidden');  // show
        // document.getElementById('typingIndicator').classList.add('hidden');     // hide
    </script>
</body>
</html>
