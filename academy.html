<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nexus Pro - Academy Library</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    :root {
      --bg-dark: #090d16;
      --card-bg: #131c2e;
      --card-border: #1e2d4a;
      --accent-blue: #38bdf8;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --radius: 12px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', system-ui, sans-serif; }
    body { background: var(--bg-dark); color: var(--text-main); min-height: 100vh; padding: 24px 16px; }
    .container { max-width: 1100px; margin: 0 auto; }
    
    .header { margin-bottom: 24px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 16px; }
    .header h1 { font-size: 1.6rem; display: flex; align-items: center; gap: 10px; }

    /* Controls Bar */
    .controls { display: flex; gap: 12px; margin-bottom: 24px; flex-wrap: wrap; }
    .search-box { flex: 2; min-width: 220px; position: relative; }
    .search-box i { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--text-muted); }
    .search-box input { width: 100%; padding: 10px 10px 10px 36px; background: var(--card-bg); border: 1px solid var(--card-border); color: #fff; border-radius: 8px; outline: none; }
    .filter-select { flex: 1; min-width: 140px; padding: 10px; background: var(--card-bg); border: 1px solid var(--card-border); color: #fff; border-radius: 8px; outline: none; cursor: pointer; }

    /* Grid Layout */
    .books-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px; }
    .book-card { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: var(--radius); overflow: hidden; display: flex; flex-direction: column; }
    .book-cover { height: 160px; background: #000; overflow: hidden; position: relative; }
    .book-cover img { width: 100%; height: 100%; object-fit: cover; }
    .book-body { padding: 16px; flex: 1; display: flex; flex-direction: column; justify-content: space-between; }
    .category-tag { font-size: 0.68rem; font-weight: 700; color: var(--accent-blue); background: rgba(56, 189, 248, 0.12); padding: 3px 8px; border-radius: 4px; display: inline-block; text-transform: uppercase; margin-bottom: 8px; }
    .book-title { font-size: 0.95rem; font-weight: 600; line-height: 1.3; margin-bottom: 4px; }
    .book-author { font-size: 0.8rem; color: var(--text-muted); margin-bottom: 16px; }
    .btn-read { display: block; text-align: center; background: #0284c7; color: #fff; text-decoration: none; padding: 8px; border-radius: 6px; font-size: 0.85rem; font-weight: 500; transition: 0.2s; }
    .btn-read:hover { background: #0369a1; }
    
    .empty-state { grid-column: 1 / -1; text-align: center; padding: 60px 0; color: var(--text-muted); }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1><i class="fas fa-book-open" style="color: var(--accent-blue);"></i> Academy Digital Library</h1>
    </div>

    <!-- Controls -->
    <div class="controls">
      <div class="search-box">
        <i class="fas fa-search"></i>
        <input type="text" id="searchBookInput" placeholder="Search books by title or author...">
      </div>
      <select id="categoryFilter" class="filter-select">
        <option value="all">All Categories</option>
        <option value="Physics">Physics</option>
        <option value="Chemistry">Chemistry</option>
        <option value="Mathematics">Mathematics</option>
        <option value="English">English</option>
        <option value="General">General</option>
      </select>
    </div>

    <!-- Book Grid Container -->
    <div class="books-grid" id="booksGrid">
      <div class="empty-state">
        <i class="fas fa-spinner fa-spin" style="font-size: 2rem; margin-bottom: 12px; color: var(--accent-blue);"></i>
        <p>Fetching digital assets...</p>
      </div>
    </div>
  </div>

  <script src="academy_books.js"></script>
</body>
</html>
