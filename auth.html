<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nexus Pro - Authentication</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="auth-page">

  <div class="auth-container">
    <div class="auth-header">
      <h2>Welcome to Nexus Pro</h2>
      <p>Access your study portal and academic dashboard</p>
    </div>

    <!-- TAB SWITCHER -->
    <div class="auth-tabs">
      <button type="button" id="loginTab" class="tab-btn active">Log In</button>
      <button type="button" id="signupTab" class="tab-btn">Sign Up</button>
    </div>

    <!-- ERROR / SUCCESS ALERT -->
    <div id="authAlert" class="auth-alert" style="display: none;"></div>

    <!-- MAIN FORM -->
    <form id="authForm" novalidate>
      
      <!-- ================= LOGIN FIELDS ================= -->
      <div id="loginFields" class="form-section active">
        <div class="form-group">
          <label for="loginEmail">Email Address</label>
          <input type="email" id="loginEmail" placeholder="student@example.com" required autocomplete="email">
        </div>

        <div class="form-group">
          <label for="loginPassword">Password</label>
          <div class="password-wrapper">
            <input type="password" id="loginPassword" placeholder="••••••••" required autocomplete="current-password">
            <button type="button" class="toggle-password" data-target="loginPassword">Show</button>
          </div>
        </div>

        <div class="form-actions">
          <a href="javascript:void(0)" id="forgotPasswordLink" class="forgot-link">Forgot Password?</a>
        </div>
      </div>

      <!-- ================= SIGNUP FIELDS ================= -->
      <div id="signupFields" class="form-section" style="display: none;">
        <div class="form-row">
          <div class="form-group">
            <label for="firstName">First Name</label>
            <input type="text" id="firstName" placeholder="John">
          </div>
          <div class="form-group">
            <label for="lastName">Last Name</label>
            <input type="text" id="lastName" placeholder="Doe">
          </div>
        </div>

        <div class="form-group">
          <label for="signupEmail">Email Address</label>
          <input type="email" id="signupEmail" placeholder="student@example.com" autocomplete="email">
        </div>

        <div class="form-group">
          <label for="signupPassword">Password</label>
          <div class="password-wrapper">
            <input type="password" id="signupPassword" placeholder="Minimum 6 characters" autocomplete="new-password">
            <button type="button" class="toggle-password" data-target="signupPassword">Show</button>
          </div>
        </div>

        <div class="form-group">
          <label for="educationType">Education Category</label>
          <select id="educationType">
            <option value="" disabled selected>Select option</option>
            <option value="secondary">Secondary (WAEC / JAMB)</option>
            <option value="tertiary">Tertiary / University</option>
          </select>
        </div>

        <!-- Secondary Fields -->
        <div id="secondaryOptions" class="conditional-fields" style="display: none;">
          <div class="form-group">
            <label for="studentClass">Target Exam / Class</label>
            <select id="studentClass">
              <option value="SS3 / WAEC">SS3 / WAEC / NECO</option>
              <option value="JAMB UTME">JAMB UTME</option>
            </select>
          </div>
        </div>

        <!-- Tertiary Fields -->
        <div id="tertiaryOptions" class="conditional-fields" style="display: none;">
          <div class="form-row">
            <div class="form-group">
              <label for="course">Course of Study</label>
              <input type="text" id="course" placeholder="e.g. Computer Science">
            </div>
            <div class="form-group">
              <label for="level">Level</label>
              <input type="text" id="level" placeholder="e.g. 100 Level">
            </div>
          </div>
        </div>
      </div>

      <!-- SUBMIT BUTTON -->
      <button type="submit" id="submitBtn" class="btn-primary">Log In</button>
    </form>
  </div>

  <!-- FORGOT PASSWORD MODAL -->
  <div id="forgotModal" class="modal-overlay" style="display: none;">
    <div class="modal-card">
      <h3>Reset Your Password</h3>
      <p>Enter your registered email address and we will generate a temporary reset key.</p>
      <div class="form-group">
        <input type="email" id="resetEmail" placeholder="Enter your registered email">
      </div>
      <div class="modal-actions">
        <button type="button" id="closeResetModal" class="btn-secondary">Cancel</button>
        <button type="button" id="sendResetBtn" class="btn-primary">Request Reset</button>
      </div>
    </div>
  </div>

  <script src="auth.js"></script>
</body>
              </html>
