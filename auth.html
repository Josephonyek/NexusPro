<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nexus Pro | Portal Access</title>
  <style>
    :root {
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: var(--bg); color: var(--text); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 1.5rem 1rem; }
    
    .auth-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; width: 100%; max-width: 440px; padding: 2rem; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
    .auth-header { text-align: center; margin-bottom: 1.5rem; }
    .auth-header h2 { font-size: 1.6rem; font-weight: 700; margin-bottom: 0.25rem; }
    .auth-header p { color: var(--text-muted); font-size: 0.875rem; }

    /* Tab switcher */
    .tab-container { display: flex; background: var(--bg); padding: 4px; border-radius: 8px; margin-bottom: 1.5rem; }
    .tab-btn { flex: 1; padding: 10px; border: none; background: transparent; color: var(--text-muted); font-weight: 600; cursor: pointer; border-radius: 6px; transition: all 0.2s; }
    .tab-btn.active { background: var(--primary); color: #fff; }

    /* Form Styles */
    .auth-form { display: none; flex-direction: column; gap: 1rem; }
    .auth-form.active { display: flex; }

    .form-group { display: flex; flex-direction: column; gap: 0.35rem; }
    .form-group label { font-size: 0.85rem; color: var(--text-muted); font-weight: 500; }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; }

    .input-wrapper { position: relative; display: flex; align-items: center; }
    .input-wrapper input, .input-wrapper select {
      width: 100%; padding: 10px 12px; background: var(--bg); border: 1px solid var(--border); border-radius: 6px; color: var(--text); font-size: 0.95rem; outline: none;
    }
    .input-wrapper input:focus, .input-wrapper select:focus { border-color: var(--primary); }
    
    .toggle-pw { position: absolute; right: 10px; background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 0.8rem; font-weight: 600; user-select: none; }
    .toggle-pw:hover { color: var(--text); }

    .forgot-link { align-self: flex-end; font-size: 0.8rem; color: var(--primary); text-decoration: none; cursor: pointer; }
    .forgot-link:hover { text-decoration: underline; }

    .submit-btn { padding: 12px; background: var(--primary); color: #fff; border: none; border-radius: 6px; font-weight: 600; cursor: pointer; margin-top: 0.5rem; font-size: 0.95rem; }
    .submit-btn:hover { background: var(--primary-hover); }

    /* Forgot Password Modal */
    .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.75); align-items: center; justify-content: center; padding: 1rem; z-index: 100; }
    .modal.active { display: flex; }
    .modal-content { background: var(--card-bg); border: 1px solid var(--border); padding: 1.5rem; border-radius: 10px; width: 100%; max-width: 380px; position: relative; }
    .close-modal { position: absolute; top: 12px; right: 12px; background: none; border: none; color: var(--text-muted); font-size: 1.4rem; cursor: pointer; }
  </style>
</head>
<body>

  <div class="auth-card">
    <div class="auth-header">
      <h2>Nexus Pro</h2>
      <p>Sign in to access your course learning portal</p>
    </div>

    <!-- TABS -->
    <div class="tab-container">
      <button type="button" class="tab-btn active" id="tab-login" onclick="switchTab('login')">Log In</button>
      <button type="button" class="tab-btn" id="tab-signup" onclick="switchTab('signup')">Sign Up</button>
    </div>

    <!-- LOG IN FORM -->
    <form id="login-form" class="auth-form active">
      <div class="form-group">
        <label for="login-email">Email Address</label>
        <div class="input-wrapper">
          <input type="email" id="login-email" required placeholder="name@example.com">
        </div>
      </div>

      <div class="form-group">
        <label for="login-password">Password</label>
        <div class="input-wrapper">
          <input type="password" id="login-password" required placeholder="••••••••">
          <button type="button" class="toggle-pw" onclick="togglePassword('login-password', this)">Show</button>
        </div>
      </div>

      <a class="forgot-link" onclick="openForgotModal()">Forgot Password?</a>
      <button type="submit" class="submit-btn">Log In</button>
    </form>

    <!-- SIGN UP FORM -->
    <form id="signup-form" class="auth-form">
      <div class="form-row">
        <div class="form-group">
          <label for="first-name">First Name</label>
          <div class="input-wrapper">
            <input type="text" id="first-name" required placeholder="John">
          </div>
        </div>
        <div class="form-group">
          <label for="last-name">Last Name</label>
          <div class="input-wrapper">
            <input type="text" id="last-name" required placeholder="Doe">
          </div>
        </div>
      </div>

      <div class="form-group">
        <label for="signup-email">Email Address</label>
        <div class="input-wrapper">
          <input type="email" id="signup-email" required placeholder="name@example.com">
        </div>
      </div>

      <div class="form-group">
        <label for="signup-password">Password</label>
        <div class="input-wrapper">
          <input type="password" id="signup-password" required placeholder="••••••••">
          <button type="button" class="toggle-pw" onclick="togglePassword('signup-password', this)">Show</button>
        </div>
      </div>

      <div class="form-group">
        <label for="confirm-password">Confirm Password</label>
        <div class="input-wrapper">
          <input type="password" id="confirm-password" required placeholder="••••••••">
          <button type="button" class="toggle-pw" onclick="togglePassword('confirm-password', this)">Show</button>
        </div>
      </div>

      <div class="form-group">
        <label for="education-type">Education Path</label>
        <div class="input-wrapper">
          <select id="education-type" onchange="handleEducationChange(this.value)">
            <option value="secondary">Secondary / High School</option>
            <option value="tertiary">University / Tertiary</option>
          </select>
        </div>
      </div>

      <!-- SECONDARY OPTIONS -->
      <div id="secondary-fields" class="form-group">
        <label for="secondary-class">Class</label>
        <div class="input-wrapper">
          <select id="secondary-class">
            <option value="SS1">SS1 / Grade 10</option>
            <option value="SS2">SS2 / Grade 11</option>
            <option value="SS3">SS3 / Grade 12</option>
            <option value="JSS1">JSS1 / Grade 7</option>
            <option value="JSS2">JSS2 / Grade 8</option>
            <option value="JSS3">JSS3 / Grade 9</option>
          </select>
        </div>
      </div>

      <!-- TERTIARY OPTIONS -->
      <div id="tertiary-fields" style="display: none; flex-direction: column; gap: 1rem;">
        <div class="form-group">
          <label for="tertiary-course">Course / Major</label>
          <div class="input-wrapper">
            <input type="text" id="tertiary-course" placeholder="e.g., Computer Science">
          </div>
        </div>

        <div class="form-group">
          <label for="tertiary-level">Level</label>
          <div class="input-wrapper">
            <select id="tertiary-level">
              <option value="Fresher">I am a fresher</option>
              <option value="100 Level">100 Level</option>
              <option value="200 Level">200 Level</option>
              <option value="300 Level">300 Level</option>
              <option value="400 Level">400 Level</option>
              <option value="500 Level">500 Level</option>
              <option value="600 Level">600 Level</option>
            </select>
          </div>
        </div>
      </div>

      <button type="submit" class="submit-btn">Create Account</button>
    </form>
  </div>

  <!-- FORGOT PASSWORD MODAL -->
  <div class="modal" id="forgot-modal">
    <div class="modal-content">
      <button class="close-modal" onclick="closeForgotModal()">&times;</button>
      <h3 style="margin-bottom: 0.5rem;">Reset Password</h3>
      <p style="font-size: 0.85rem; color: var(--text-muted); margin-bottom: 1rem;">
        Enter your email address below to receive password recovery instructions.
      </p>
      <form id="forgot-form" onsubmit="handleForgotSubmit(event)">
        <div class="form-group" style="margin-bottom: 1rem;">
          <label for="forgot-email">Email Address</label>
          <div class="input-wrapper">
            <input type="email" id="forgot-email" required placeholder="name@example.com">
          </div>
        </div>
        <button type="submit" class="submit-btn" style="width: 100%;">Send Instructions</button>
      </form>
    </div>
  </div>

  <script src="auth.js"></script>
</body>
        </html>
