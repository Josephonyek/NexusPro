<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nexus Pro - Reset Password</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    :root {
      --bg-dark: #090d16;
      --card-bg: #131c2e;
      --card-border: #1e2d4a;
      --accent-blue: #38bdf8;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --danger: #ef4444;
      --success: #22c55e;
      --radius: 12px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', system-ui, sans-serif; }
    body { background: var(--bg-dark); color: var(--text-main); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
    
    .auth-card { background: var(--card-bg); border: 1px solid var(--card-border); padding: 32px; border-radius: var(--radius); width: 100%; max-width: 420px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
    .auth-header { text-align: center; margin-bottom: 24px; }
    .auth-header i { font-size: 2.5rem; color: var(--accent-blue); margin-bottom: 10px; }
    .auth-header h1 { font-size: 1.4rem; margin-bottom: 6px; }
    .auth-header p { font-size: 0.85rem; color: var(--text-muted); }

    .form-group { margin-bottom: 16px; }
    label { display: block; font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; margin-bottom: 6px; font-weight: 600; }
    .input-wrapper { position: relative; }
    .input-wrapper i { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--text-muted); }
    input { width: 100%; padding: 12px 12px 12px 38px; background: var(--bg-dark); border: 1px solid var(--card-border); color: #fff; border-radius: 8px; outline: none; font-size: 0.9rem; }
    input:focus { border-color: var(--accent-blue); }

    .btn { width: 100%; padding: 12px; background: #0284c7; color: #fff; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; transition: 0.2s; display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 8px; }
    .btn:hover { background: #0369a1; }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; }

    .message-box { padding: 10px; border-radius: 6px; font-size: 0.85rem; margin-bottom: 16px; display: none; text-align: center; }
    .message-box.error { background: rgba(239, 68, 68, 0.15); border: 1px solid var(--danger); color: var(--danger); }
    .message-box.success { background: rgba(34, 197, 94, 0.15); border: 1px solid var(--success); color: var(--success); }

    .back-link { display: block; text-align: center; margin-top: 20px; font-size: 0.85rem; color: var(--accent-blue); text-decoration: none; }
    .back-link:hover { text-decoration: underline; }
  </style>
</head>
<body>

  <div class="auth-card">
    <div class="auth-header">
      <i class="fas fa-shield-alt"></i>
      <h1>Reset Password</h1>
      <p id="subHeading">Enter your email to receive a verification OTP code</p>
    </div>

    <div class="message-box" id="msgBox"></div>

    <!-- STEP 1: Request OTP -->
    <form id="step1Form">
      <div class="form-group">
        <label for="emailInput">Student Email</label>
        <div class="input-wrapper">
          <i class="fas fa-envelope"></i>
          <input type="email" id="emailInput" placeholder="student@example.com" required>
        </div>
      </div>
      <button type="submit" class="btn" id="sendOtpBtn">
        <i class="fas fa-paper-plane"></i> Send OTP Code
      </button>
    </form>

    <!-- STEP 2: Verify OTP & Change Password -->
    <form id="step2Form" style="display: none;">
      <div class="form-group">
        <label for="otpInput">6-Digit Verification OTP</label>
        <div class="input-wrapper">
          <i class="fas fa-key"></i>
          <input type="text" id="otpInput" maxlength="6" placeholder="e.g., 482910" required style="letter-spacing: 4px; font-weight: bold;">
        </div>
      </div>

      <div class="form-group">
        <label for="newPassInput">New Password</label>
        <div class="input-wrapper">
          <i class="fas fa-lock"></i>
          <input type="password" id="newPassInput" placeholder="••••••••" required>
        </div>
      </div>

      <div class="form-group">
        <label for="confirmPassInput">Confirm New Password</label>
        <div class="input-wrapper">
          <i class="fas fa-check-double"></i>
          <input type="password" id="confirmPassInput" placeholder="••••••••" required>
        </div>
      </div>

      <button type="submit" class="btn" id="resetPassBtn">
        <i class="fas fa-save"></i> Change Password
      </button>
    </form>

    <a href="auth.html" class="back-link"><i class="fas fa-arrow-left"></i> Back to Login</a>
  </div>

  <script>
    const API_ENDPOINT = "/api/forgot-password.js";
    const msgBox = document.getElementById("msgBox");
    const step1Form = document.getElementById("step1Form");
    const step2Form = document.getElementById("step2Form");
    const subHeading = document.getElementById("subHeading");

    let targetEmail = "";

    function showMsg(text, isError = true) {
      msgBox.className = `message-box ${isError ? 'error' : 'success'}`;
      msgBox.textContent = text;
      msgBox.style.display = "block";
    }

    // Handle STEP 1: Send OTP
    step1Form.addEventListener("submit", async (e) => {
      e.preventDefault();
      msgBox.style.display = "none";
      
      const email = document.getElementById("emailInput").value.trim();
      const sendOtpBtn = document.getElementById("sendOtpBtn");

      sendOtpBtn.disabled = true;
      sendOtpBtn.innerHTML = `<i class="fas fa-spinner fa-spin"></i> Checking Email...`;

      try {
        const res = await fetch(`${API_ENDPOINT}?action=request-otp`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email })
        });

        const data = await res.json();
        if (!res.ok || !data.success) throw new Error(data.error || "Failed to send OTP");

        targetEmail = email;
        showMsg("OTP code sent to your email! Please check your inbox.", false);
        
        // Transition to Step 2
        step1Form.style.display = "none";
        step2Form.style.display = "block";
        subHeading.textContent = `Enter the 6-digit code sent to ${email}`;

      } catch (err) {
        showMsg(err.message, true);
      } finally {
        sendOtpBtn.disabled = false;
        sendOtpBtn.innerHTML = `<i class="fas fa-paper-plane"></i> Send OTP Code`;
      }
    });

    // Handle STEP 2: Verify OTP & Change Password
    step2Form.addEventListener("submit", async (e) => {
      e.preventDefault();
      msgBox.style.display = "none";

      const otp = document.getElementById("otpInput").value.trim();
      const newPassword = document.getElementById("newPassInput").value;
      const confirmPassword = document.getElementById("confirmPassInput").value;
      const resetPassBtn = document.getElementById("resetPassBtn");

      if (newPassword !== confirmPassword) {
        showMsg("Passwords do not match!", true);
        return;
      }

      if (newPassword.length < 6) {
        showMsg("Password must be at least 6 characters long.", true);
        return;
      }

      resetPassBtn.disabled = true;
      resetPassBtn.innerHTML = `<i class="fas fa-spinner fa-spin"></i> Updating Password...`;

      try {
        const res = await fetch(`${API_ENDPOINT}?action=reset-password`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email: targetEmail, otp, newPassword })
        });

        const data = await res.json();
        if (!res.ok || !data.success) throw new Error(data.error || "Reset failed");

        showMsg("Password updated successfully! Redirecting to login...", false);
        step2Form.reset();

        setTimeout(() => {
          window.location.href = "auth.html";
        }, 2000);

      } catch (err) {
        showMsg(err.message, true);
      } finally {
        resetPassBtn.disabled = false;
        resetPassBtn.innerHTML = `<i class="fas fa-save"></i> Change Password`;
      }
    });
  </script>
</body>
</html>
