<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus Pro | Account Recovery Gateway</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- EmailJS SDK -->
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <style>
        :root {
            --bg-dark: #0f172a;
            --bg-deep: #090d16;
            --glass-panel: rgba(30, 41, 59, 0.45);
            --glass-border: rgba(255, 255, 255, 0.08);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --neon-blue: #3b82f6;
            --accent-green: #10b981;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background-color: var(--bg-dark); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; justify-content: space-between; }
        .glass { background: var(--glass-panel); backdrop-filter: blur(12px); border: 1px solid var(--glass-border); border-radius: 12px; }
        .auth-container { flex: 1; display: flex; justify-content: center; align-items: center; padding: 40px 24px; }
        .auth-card { width: 100%; max-width: 440px; padding: 40px; border-top: 4px solid var(--neon-blue); }
        .auth-header { text-align: center; margin-bottom: 25px; }
        .auth-icon-wrapper { width: 60px; height: 60px; background: rgba(59, 130, 246, 0.1); border: 1px solid rgba(59, 130, 246, 0.2); color: var(--neon-blue); border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 1.5rem; margin: 0 auto 15px auto; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-size: 0.82rem; font-weight: 600; text-transform: uppercase; color: var(--text-muted); margin-bottom: 8px; }
        .input-wrapper { position: relative; }
        .input-wrapper i { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: #64748b; }
        .form-control { width: 100%; background: rgba(0, 0, 0, 0.2); border: 1px solid var(--glass-border); color: white; padding: 12px 16px 12px 42px; border-radius: 8px; font-size: 0.95rem; outline: none; }
        .btn-submit { width: 100%; background: var(--neon-blue); color: #fff; border: none; padding: 13px; border-radius: 8px; font-weight: 600; font-size: 0.95rem; cursor: pointer; display: flex; justify-content: center; align-items: center; gap: 8px; }
        .feedback-panel { padding: 14px; border-radius: 8px; font-size: 0.88rem; margin-bottom: 20px; display: none; gap: 10px; }
    </style>
</head>
<body>

    <main class="auth-container">
        <div class="auth-card glass">
            <div class="auth-header">
                <div class="auth-icon-wrapper"><i class="fas fa-paper-plane"></i></div>
                <h1>System Key Recovery</h1>
                <p>Enter your routing email credentials to send a custom direct reset link.</p>
            </div>

            <div id="status-error" class="feedback-panel" style="background: rgba(239, 68, 68, 0.1); border: 1px solid rgba(239, 68, 68, 0.2); color: #f87171;">
                <i class="fas fa-triangle-exclamation"></i><span id="error-text"></span>
            </div>

            <form id="direct-recovery-form">
                <div class="form-group">
                    <label for="recovery-email">Routing Email Address</label>
                    <div class="input-wrapper">
                        <input type="email" id="recovery-email" class="form-control" placeholder="user@example.com" required>
                        <i class="fas fa-envelope"></i>
                    </div>
                </div>
                <button type="submit" class="btn-submit" id="btn-trigger">
                    <i class="fas fa-paper-plane"></i> Dispatch Custom Recovery Link
                </button>
            </form>
        </div>
    </main>

    <script type="module">
        import { auth } from "./firebase-config.js";
        import { generatePasswordResetLink } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        // Initialize EmailJS
        emailjs.init("YOUR_EMAILJS_PUBLIC_KEY"); // Replace with your Public Key

        const recoveryForm = document.getElementById("direct-recovery-form");
        const emailInput = document.getElementById("recovery-email");
        const btnTrigger = document.getElementById("btn-trigger");
        const errPanel = document.getElementById("status-error");
        const errText = document.getElementById("error-text");

        recoveryForm.addEventListener("submit", async (e) => {
            e.preventDefault();
            errPanel.style.display = "none";

            const userEmail = emailInput.value.trim();

            btnTrigger.disabled = true;
            btnTrigger.innerHTML = `<i class="fas fa-spinner fa-spin"></i> Generating Custom Link...`;

            try {
                // 1. Generate the raw reset link targeted directly at your Vercel endpoint
                const actionCodeSettings = {
                    url: 'https://nexus-pro-iota.vercel.app/reset_password.html',
                    handleCodeInApp: true
                };

                const resetLink = await generatePasswordResetLink(auth, userEmail, actionCodeSettings);

                btnTrigger.innerHTML = `<i class="fas fa-spinner fa-spin"></i> Dispatching Email...`;

                // 2. Send email directly via EmailJS
                await emailjs.send("YOUR_SERVICE_ID", "YOUR_TEMPLATE_ID", {
                    to_email: userEmail,
                    reset_link: resetLink
                });

                // 3. Redirect to notice page
                window.location.href = "recovery_notice.html";

            } catch (error) {
                console.error("Direct Email Dispatch Error:", error);
                errText.innerText = `Dispatch Failed: ${error.message}`;
                errPanel.style.display = "flex";
                btnTrigger.disabled = false;
                btnTrigger.innerHTML = `<i class="fas fa-paper-plane"></i> Dispatch Custom Recovery Link`;
            }
        });
    </script>
</body>
    </html>
