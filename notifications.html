<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nexus Pro - Student Notifications</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    :root { --bg-dark: #090d16; --card-bg: #131c2e; --card-border: #1e2d4a; --accent-blue: #38bdf8; --text-main: #f8fafc; --text-muted: #94a3b8; }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', system-ui, sans-serif; }
    body { background: var(--bg-dark); color: var(--text-main); padding: 24px 16px; }
    .container { max-width: 750px; margin: 0 auto; }
    .notif-card { background: var(--card-bg); border: 1px solid var(--card-border); border-left: 4px solid var(--accent-blue); border-radius: 12px; padding: 18px; margin-bottom: 14px; transition: opacity 0.2s; }
    .notif-card.seen { opacity: 0.65; border-left-color: var(--text-muted); }
    .seen-control { margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--card-border); display: flex; align-items: center; gap: 8px; font-size: 0.82rem; color: var(--text-muted); cursor: pointer; user-select: none; }
    .seen-control input { accent-color: var(--accent-blue); width: 16px; height: 16px; cursor: pointer; }
  </style>
</head>
<body>
  <div class="container">
    <h1 style="margin-bottom: 20px;"><i class="fas fa-bell" style="color: var(--accent-blue);"></i> Announcements</h1>
    <div id="notifListContainer">Loading notifications...</div>
  </div>

  <script>
    const userEmail = localStorage.getItem("userEmail") || "";

    async function loadNotifications() {
      const container = document.getElementById("notifListContainer");
      try {
        const res = await fetch(`/api/notifications.js?action=get-notifications&email=${encodeURIComponent(userEmail)}`);
        const data = await res.json();
        
        if (!data.success || !data.notifications.length) {
          container.innerHTML = `<p style="text-align:center; color: var(--text-muted);">No announcements right now.</p>`;
          return;
        }

        container.innerHTML = data.notifications.map(n => `
          <div class="notif-card ${n.is_seen ? 'seen' : ''}" id="card-${n.id}">
            <div style="display:flex; justify-content:space-between; margin-bottom:6px;">
              <strong style="font-size:1.05rem;">${escapeHtml(n.title)}</strong>
              <span style="font-size:0.75rem; color:var(--text-muted);">${new Date(Number(n.created_at)).toLocaleDateString()}</span>
            </div>
            <p style="font-size:0.9rem; color:#cbd5e1; white-space:pre-line;">${escapeHtml(n.message)}</p>

            <label class="seen-control">
              <input type="checkbox" ${n.is_seen ? 'checked disabled' : ''} onchange="markAsSeen('${n.id}', this)">
              <span>${n.is_seen ? 'Seen' : 'Mark as seen'}</span>
            </label>
          </div>
        `).join("");

      } catch (err) {
        container.innerHTML = `<p style="color:#ef4444;">Failed to load announcements.</p>`;
      }
    }

    async function markAsSeen(notifId, checkbox) {
      if (!userEmail) { alert("Please log in to register read status."); return; }
      try {
        const res = await fetch('/api/notifications.js?action=mark-seen', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ notification_id: notifId, student_email: userEmail })
        });
        const data = await res.json();
        if (data.success) {
          checkbox.disabled = true;
          checkbox.nextElementSibling.textContent = "Seen";
          document.getElementById(`card-${notifId}`).classList.add('seen');
        }
      } catch (err) {
        checkbox.checked = false;
        alert("Failed to update status");
      }
    }

    function escapeHtml(str) { return String(str||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
    loadNotifications();
  </script>
</body>
</html>
