<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nexus Pro - Notifications</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    :root {
      --bg-dark: #090d16;
      --card-bg: #131c2e;
      --card-border: #1e2d4a;
      --accent-blue: #38bdf8;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --radius: 12px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', system-ui, sans-serif; }
    body { background: var(--bg-dark); color: var(--text-main); min-height: 100vh; padding: 24px 16px; }
    .container { max-width: 800px; margin: 0 auto; }
    
    .header { margin-bottom: 24px; display: flex; align-items: center; gap: 12px; }
    .header h1 { font-size: 1.5rem; }

    .notif-list { display: flex; flex-direction: column; gap: 14px; }
    .notif-card { background: var(--card-bg); border: 1px solid var(--card-border); padding: 18px; border-radius: var(--radius); position: relative; }
    .notif-card.broadcast { border-left: 4px solid var(--accent-blue); }
    
    .notif-meta { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .notif-title { font-weight: 600; font-size: 1.05rem; color: #fff; }
    .notif-date { font-size: 0.75rem; color: var(--text-muted); }
    .notif-body { font-size: 0.9rem; color: #cbd5e1; line-height: 1.5; white-space: pre-line; }

    .empty-state { text-align: center; padding: 60px 0; color: var(--text-muted); }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <i class="fas fa-bell" style="font-size: 1.6rem; color: var(--accent-blue);"></i>
      <h1>Academy Announcements & Notifications</h1>
    </div>

    <div class="notif-list" id="notifListContainer">
      <div class="empty-state">
        <i class="fas fa-spinner fa-spin" style="font-size: 2rem; margin-bottom: 10px; color: var(--accent-blue);"></i>
        <p>Checking for new announcements...</p>
      </div>
    </div>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", async () => {
      const container = document.getElementById("notifListContainer");

      try {
        const token = localStorage.getItem("nexusToken") || localStorage.getItem("token") || "";
        const userEmail = localStorage.getItem("userEmail") || ""; // Optional user email check

        const res = await fetch(`/api/notifications.js?action=get-notifications&email=${encodeURIComponent(userEmail)}`, {
          headers: { "Authorization": `Bearer ${token}` }
        });

        if (!res.ok) throw new Error("Could not load notifications");

        const data = await res.json();
        const notifications = data.notifications || [];

        if (notifications.length === 0) {
          container.innerHTML = `
            <div class="empty-state">
              <i class="fas fa-bell-slash" style="font-size: 2.5rem; margin-bottom: 12px;"></i>
              <p>You have no new notifications.</p>
            </div>
          `;
          return;
        }

        container.innerHTML = notifications.map(notif => `
          <div class="notif-card broadcast">
            <div class="notif-meta">
              <div class="notif-title">${escapeHtml(notif.title)}</div>
              <div class="notif-date">${new Date(Number(notif.created_at)).toLocaleDateString()}</div>
            </div>
            <div class="notif-body">${escapeHtml(notif.message)}</div>
          </div>
        `).join("");

      } catch (err) {
        container.innerHTML = `
          <div class="empty-state" style="color: #ef4444;">
            <i class="fas fa-exclamation-triangle" style="font-size: 2rem; margin-bottom: 10px;"></i>
            <p>Error loading announcements.</p>
          </div>
        `;
      }

      function escapeHtml(str) {
        return String(str || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
      }
    });
  </script>
</body>
</html>
